# Builds the Windows and Mac apps on GitHub's own Windows and Mac machines.
# Run it from the repository's Actions tab: Build desktop apps > Run workflow. The finished files appear at the
# bottom of the run page under "Artifacts" about 5 to 10 minutes later.
name: Build desktop apps

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            label: Mac
          - os: windows-latest
            script: dist:win
            label: Windows
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Check the app shell
        run: npm test
      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: PFT-Interpreter-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

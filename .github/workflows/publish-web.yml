# Publishes the app as a web page at https://<your-github-name>.github.io/pft-interpreter/
# Runs on every push to main that changes the app, and can be started by hand from the Actions tab (Run workflow).
# The repository must be public for GitHub Pages on a free plan.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish web app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publish-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4

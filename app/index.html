<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PFT Interpreter</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
/* Layout: one working column. A stepper pins to the top, each test is one form card with a live
   "reads as" panel beneath it, and the report is a serif document followed by the heads-up list. */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --surface-2: #F5F8F9;
  --ink: #13242B;
  --ink-2: #3A4E57;
  --muted: #5E7079;
  --line: #D2DBDF;
  --line-strong: #AEBDC4;
  --accent: #0A6870;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEEEF;
  --chart-1: #0086A0;   /* chart series: validated for chroma, lightness band and 3:1 contrast on the surface */
  --c-wnl: #1C7448;     --c-wnl-bg: #E0F1E7;
  --c-bl: #7F6500;      --c-bl-bg: #FAF0C6;
  --c-mild: #9B5A00;    --c-mild-bg: #FCE8C6;
  --c-mod: #B0420A;     --c-mod-bg: #FADCCB;
  --c-sev: #A51F19;     --c-sev-bg: #F6D2CF;
  --c-high: #34509E;    --c-high-bg: #DCE3F6;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-doc: 'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D171C; --surface: #14222A; --surface-2: #192B34; --ink: #E5EEF1; --ink-2: #C3D1D7; --muted: #8DA0A9;
    --line: #28383F; --line-strong: #3C505A; --accent: #55C1C9; --accent-ink: #062A2E; --accent-soft: #123A3F; --chart-1: #1AA3B8;
    --c-wnl: #6FD39B; --c-wnl-bg: #143525; --c-bl: #E3C557; --c-bl-bg: #3A3213; --c-mild: #F0B35A; --c-mild-bg: #3C2B10;
    --c-mod: #F29A6C; --c-mod-bg: #40230F; --c-sev: #FF8E86; --c-sev-bg: #44191A; --c-high: #8FA9F2; --c-high-bg: #1B2646;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D171C; --surface: #14222A; --surface-2: #192B34; --ink: #E5EEF1; --ink-2: #C3D1D7; --muted: #8DA0A9;
  --line: #28383F; --line-strong: #3C505A; --accent: #55C1C9; --accent-ink: #062A2E; --accent-soft: #123A3F; --chart-1: #1AA3B8;
  --c-wnl: #6FD39B; --c-wnl-bg: #143525; --c-bl: #E3C557; --c-bl-bg: #3A3213; --c-mild: #F0B35A; --c-mild-bg: #3C2B10;
  --c-mod: #F29A6C; --c-mod-bg: #40230F; --c-sev: #FF8E86; --c-sev-bg: #44191A; --c-high: #8FA9F2; --c-high-bg: #1B2646;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { max-width: 1080px; margin-inline: auto; padding-inline: 16px; padding-block: 14px 56px; }

/* ---- header ---- */
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding-block: 4px 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; width: 40px; height: 32px; color: var(--accent); }
.brand h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.brand p { font-size: 12.5px; color: var(--muted); }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; line-height: 1.2; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.quiet:hover { background: var(--surface-2); border-color: var(--line); }
.btn.danger { border-color: var(--c-sev); color: var(--c-sev); }
.btn.sm { padding: 5px 10px; font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.chip.alert { background: var(--c-sev-bg); border-color: var(--c-sev); color: var(--c-sev); }
.chip.caution { background: var(--c-mild-bg); border-color: var(--c-mild); color: var(--c-mild); }
.chip.note { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip.ok { background: var(--c-wnl-bg); border-color: var(--c-wnl); color: var(--c-wnl); }
button.chip { cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; }

/* ---- stepper ---- */
.steps { display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); scrollbar-width: thin; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13px; white-space: nowrap; flex: none; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.pill.has .dot { background: var(--c-wnl); }
.pill.warn .dot { background: var(--c-sev); }
.pill[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill[aria-current="step"] .dot { background: var(--accent-ink); }

/* ---- main ---- */
.main { display: grid; gap: 16px; padding-top: 6px; outline: none; }
.main:focus { outline: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.card > h2, .step-head h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
.step-head { display: grid; gap: 6px; margin-bottom: 8px; }
.step-head .intro { color: var(--ink-2); max-width: 70ch; }
.src { font-size: 12.5px; color: var(--muted); max-width: 90ch; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .grid-2.side { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } }

/* ---- test selector ---- */
.sel-group { display: grid; gap: 8px; margin-top: 16px; }
.sel-group h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.tt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 0; }
.tt:hover { border-color: var(--line-strong); }
.tt input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.tt .nm { font-weight: 600; font-size: 14px; display: block; }
.tt .ds { font-size: 12.5px; color: var(--muted); display: block; }
.tt.on { border-color: var(--accent); background: var(--accent-soft); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.start-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.start-row .count { color: var(--muted); font-size: 13.5px; }

/* ---- side panel ---- */
.side-card { display: grid; gap: 10px; }
.side-card h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.ex-list { display: grid; gap: 6px; }
.ex { text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: grid; gap: 1px; }
.ex:hover { border-color: var(--accent); }
.ex b { font-size: 13.5px; font-weight: 600; }
.ex span { font-size: 12.5px; color: var(--muted); }
.zkey { display: grid; gap: 6px; }
.zbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line-strong); font-size: 11px; font-weight: 600; }
.zbar span { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.zbar .s { background: var(--c-sev-bg); color: var(--c-sev); }
.zbar .m { background: var(--c-mod-bg); color: var(--c-mod); }
.zbar .l { background: var(--c-mild-bg); color: var(--c-mild); }
.zbar .n { background: var(--c-wnl-bg); color: var(--c-wnl); }
.zbar .h { background: var(--c-high-bg); color: var(--c-high); }
.zticks { position: relative; height: 38px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.zticks .t { position: absolute; transform: translateX(-50%); white-space: nowrap; line-height: 1.2; }
.zticks .t.a { top: 5px; }
.zticks .t.b { top: 22px; }
.zticks .t::after { content: ''; position: absolute; left: 50%; width: 1px; background: var(--line-strong); }
.zticks .t.a::after { top: -5px; height: 5px; }
.zticks .t.b::after { top: -22px; height: 21px; }
.fine { font-size: 12.5px; color: var(--muted); }

/* ---- form ---- */
.grp { display: grid; gap: 0; margin-top: 14px; }
.grp > h3, .grp-head h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.grp-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; padding-bottom: 6px; }
.btn.quick { font-size: 12.5px; padding: 3px 9px; color: var(--accent); border-color: var(--line); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 16px; padding-block: 6px 4px; }
.fld { display: grid; gap: 4px; min-width: 0; align-content: start; }
.fld label, .fld .lab { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.fld.wide { grid-column: 1 / -1; }
.inwrap { display: flex; align-items: center; gap: 6px; }
.inwrap .unit { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
input[type="text"], input[type="date"], select { width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); }
input[type="text"].num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
select { appearance: auto; }
.chkrow { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); grid-column: 1 / -1; }
.chkrow input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.hint { font-size: 12px; color: var(--muted); }

.prm { display: grid; gap: 6px; padding-block: 11px; border-top: 1px solid var(--line); }
.fields > .prm { grid-column: 1 / -1; }
.fields > .prm:first-child { border-top: 0; }
input.bad { border-color: var(--c-sev); }
.prm-top { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; justify-content: space-between; }
.prm-l { font-weight: 600; font-size: 14.5px; }
.prm-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.sg { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink-2); font-size: 13px; line-height: 1.25; }
.sg:hover { border-color: var(--accent); }
.sg[aria-pressed="true"] { font-weight: 650; border-color: var(--ink-2); background: var(--surface-2); color: var(--ink); }
.sg[aria-pressed="true"][data-v="wnl"] { background: var(--c-wnl-bg); border-color: var(--c-wnl); color: var(--c-wnl); }
.sg[aria-pressed="true"][data-v="bl"] { background: var(--c-bl-bg); border-color: var(--c-bl); color: var(--c-bl); }
.sg[aria-pressed="true"][data-v="mild"] { background: var(--c-mild-bg); border-color: var(--c-mild); color: var(--c-mild); }
.sg[aria-pressed="true"][data-v="mod"] { background: var(--c-mod-bg); border-color: var(--c-mod); color: var(--c-mod); }
.sg[aria-pressed="true"][data-v="sev"], .sg[aria-pressed="true"][data-v="low"] { background: var(--c-sev-bg); border-color: var(--c-sev); color: var(--c-sev); }
.sg[aria-pressed="true"][data-v="high"] { background: var(--c-high-bg); border-color: var(--c-high); color: var(--c-high); }
.zwrap { display: flex; align-items: center; gap: 6px; }
.zbox { display: inline-flex; align-items: center; gap: 6px; }
.zlink { border: 0; background: transparent; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 2px; padding: 3px 4px; }
.zlink:hover { color: var(--accent); }
.zwrap input { width: 92px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding: 5px 8px; }
.zwrap .st { font-size: 12.5px; color: var(--muted); }
.zwrap .st b { color: var(--ink-2); font-weight: 600; }
.note-inline { font-size: 12.5px; color: var(--c-mild); }

/* ---- live read ---- */
.live { margin-top: 16px; padding: 14px 16px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-2); display: grid; gap: 8px; }
.live h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.live p { font-family: var(--font-doc); font-size: 15px; line-height: 1.55; max-width: 78ch; }
.live .empty { color: var(--muted); font-family: var(--font-ui); font-size: 13.5px; }
.code { display: inline-block; font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.live h3 .codes { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 18px; }

/* ---- prior ---- */
.prior-card { border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-top: 12px; background: var(--surface); }
.prior-card .ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.prior-card .ph b { font-size: 14px; }
.warn-line { font-size: 13px; color: var(--c-mild); margin-top: 8px; }

/* ---- report ---- */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bar .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 4vw, 34px); font-family: var(--font-doc); }
.doc .dt { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.doc .meta { font-family: var(--font-ui); font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; margin-top: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.doc .sec { margin-top: 16px; display: grid; gap: 4px; }
.doc .sec h3 { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 650; color: var(--accent); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.doc .sec p { font-size: 16px; line-height: 1.6; max-width: 80ch; }
.doc .interp { margin-top: 22px; padding-top: 14px; border-top: 2px solid var(--ink); }
.doc .interp h3 { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
.doc ol { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; max-width: 80ch; }
.doc ol li { font-size: 16.5px; line-height: 1.55; padding-left: 4px; }
.doc ol li::marker { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
details.plain { margin-top: 10px; }
details.plain summary { cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
pre.plain { margin: 8px 0 0; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
textarea.case { width: 100%; min-height: 90px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; }

/* ---- heads-up ---- */
.hu { display: grid; gap: 0; }
.hu-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.hu-head h2 { font-size: 22px; font-weight: 650; }
.hu-sum { display: flex; flex-wrap: wrap; gap: 6px; }
.hu-item { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.hu-item .lv { display: grid; gap: 4px; align-content: start; }
.hu-item .cat { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hu-item h4 { font-size: 14.5px; font-weight: 650; }
.hu-item p { font-size: 14px; color: var(--ink-2); max-width: 85ch; }
.hu-empty { padding: 14px 0 4px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); }
@media (max-width: 560px) { .hu-item { grid-template-columns: minmax(0, 1fr); } .hu-item .lv { display: flex; align-items: center; gap: 8px; } }

/* ---- method ---- */
details.method { margin-top: 4px; }
details.method summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.method .mbody { display: grid; gap: 8px; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); max-width: 90ch; }
details.method ul { margin: 0; padding-left: 1.2em; display: grid; gap: 3px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 20; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.fallback { display: grid; gap: 6px; margin-top: 10px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- tap choices (replace dropdowns) ---- */
.seg.stack { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); width: 100%; }
.ch { padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--ink-2); font-size: 13.5px; line-height: 1.25; text-align: left; }
.ch:hover { border-color: var(--accent); }
.ch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg.stack .ch { text-align: left; }
.prm.ch-row .seg { margin-top: 0; }
.tapnote { margin-block: 4px 2px; }

/* ---- indication chips ---- */
.chip-group { display: grid; gap: 5px; margin-top: 4px; }
.chip-group h4 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cp { padding: 5px 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-size: 13.5px; line-height: 1.25; }
.cp:hover { border-color: var(--accent); }
.cp[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.prm.multi { gap: 10px; }
.qdates { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.qdates .cp { padding: 3px 10px; font-size: 12.5px; }

/* ---- collapsed optional typing ---- */
details.optgrp { margin-top: 12px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-2); }
details.optgrp > summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 9px 12px; font-size: 13.5px; color: var(--ink-2); font-weight: 500; list-style: none; }
details.optgrp > summary::-webkit-details-marker { display: none; }
details.optgrp > summary::before { content: '▸'; color: var(--muted); font-size: 12px; transition: transform 0.12s; }
details.optgrp[open] > summary::before { transform: rotate(90deg); }
details.optgrp .tag { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) { details.optgrp > summary::before { transition: none; } }

/* ---- flow–volume loop gallery ---- */
.lp-wrap { gap: 10px; }
.lp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 158px), 1fr)); gap: 10px; }
.lp-tile { display: grid; grid-template-rows: auto auto 1fr; gap: 4px; text-align: left; padding: 8px 10px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); align-content: start; min-width: 0; }
.lp-tile:hover { border-color: var(--accent); }
.lp-tile[aria-checked="true"] { border: 2px solid var(--accent); padding: 7px 9px 9px; background: var(--accent-soft); }
.lp { width: 100%; height: auto; display: block; background: var(--surface-2); border-radius: 6px; }
.lp-tile[aria-checked="true"] .lp { background: var(--surface); }
.lp-name { font-size: 13px; font-weight: 650; line-height: 1.25; }
.lp-cap { font-size: 12px; line-height: 1.35; color: var(--muted); }
.lp-ax { stroke: var(--line-strong); stroke-width: 0.8; }

.lp-cur { stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.lp-dot { fill: var(--accent); stroke: none; }
.lp-big { width: 100%; max-width: 440px; height: auto; display: block; margin-top: 8px; }
.lp-t { font-family: var(--font-ui); font-size: 11px; fill: var(--ink-2); }
.lp-t.m { fill: var(--muted); font-size: 10.5px; }

/* ---- section switcher in the header ---- */
.top-actions { row-gap: 8px; }
.views { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.vw { padding: 6px 13px; font-size: 13px; font-weight: 500; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--ink-2); line-height: 1.2; display: inline-flex; align-items: center; }
.vw:last-child { border-right: 0; }
.vw:hover { background: var(--surface-2); }
.vw[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.bn { margin-left: 6px; min-width: 18px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; font-weight: 600; text-align: center; }
.vw[aria-current="page"] .bn { background: var(--accent-ink); color: var(--accent); }

/* ---- (i) info buttons and the pop-up ---- */
.ib { position: relative; display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; padding: 0; margin-left: 6px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--accent); font: italic 600 12px/1 var(--font-doc); vertical-align: middle; }
.ib::after { content: ''; position: absolute; inset: -8px; }
.ib:hover, .ib[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.lab-row, .prm-lw, .sh-title { display: flex; align-items: center; min-width: 0; }
.lab-row { gap: 0; }
.sh-title { gap: 4px; flex-wrap: wrap; }
.sh-title .ib { margin-left: 2px; }
.sel-group h3 .ib, .side-card h3 .ib { margin-left: 6px; }
.ttw { position: relative; min-width: 0; }
.ttw > .tt { height: 100%; padding-right: 36px; }
.ttw > .ib { position: absolute; top: 10px; right: 10px; margin: 0; }
.pop { position: fixed; left: 0; top: 0; z-index: 40; width: min(380px, calc(100vw - 16px)); max-height: min(72vh, 480px); overflow: auto; display: grid; gap: 8px; padding: 12px 14px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 12px 32px rgba(8, 20, 26, 0.22); font-size: 13.5px; line-height: 1.45; outline: none; }
.pop.pinned { border-color: var(--accent); }
.pop-h { display: grid; gap: 1px; }
.pop-h b { font-size: 15px; font-weight: 650; }
.pop-h span { font-size: 12.5px; color: var(--muted); }
.pop-w { color: var(--ink); }
.pop dl { margin: 0; display: grid; gap: 2px 0; }
.pop dt { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-top: 4px; }
.pop dd { margin: 0; color: var(--ink-2); }
.pop-more { justify-self: start; padding: 4px 10px; border: 1px solid var(--accent); border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }

.code-btn { border: 1px solid transparent; cursor: pointer; }
.code-btn:hover, .code-btn[aria-expanded="true"] { border-color: var(--accent); }
.codes-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 14px; font-family: var(--font-ui); }
.codes-row .codes { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.learn-link { margin: 2px 0 6px; }

/* ---- heads-up: look-for tips with pictures, ratings ---- */
.chip.tip { background: var(--c-high-bg); border-color: var(--c-high); color: var(--c-high); }
.hu-item[data-lvl="tip"] { background: linear-gradient(to right, var(--c-high-bg), transparent 55%); margin-inline: -18px; padding-inline: 18px; }
.look-figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; margin-top: 10px; max-width: 640px; }
.look-fig { margin: 0; padding: 6px 8px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.look-fig .lp { background: var(--surface-2); }
.look-fig figcaption { margin-top: 5px; font-size: 12px; line-height: 1.35; color: var(--ink-2); }
.hu-rate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.rt { padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; }

/* ---- 6MWD trend ---- */
.tr-block { margin-top: 18px; }
.tr-actions { display: flex; gap: 6px; }

.tr-date { font-size: 14px; font-weight: 600; padding-block: 7px; }

.tr-w { font-size: 13.5px; color: var(--ink-2); }
.tr-lines { margin: 0; padding-left: 1.2em; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 2px; }
.tr-chartwrap { position: relative; margin-top: 12px; }
.tr-empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); font-size: 13.5px; background: var(--surface-2); }
.tr-svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; touch-action: pan-y; }
.tr-svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tr-t { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.tr-t.val { fill: var(--ink); font-size: 12px; font-weight: 500; }
.tr-t.muted { fill: var(--muted); }
.tr-t.axis { font-family: var(--font-ui); font-size: 11px; }
.tr-grid { stroke: var(--line); stroke-width: 1; }
.tr-axis { stroke: var(--line-strong); stroke-width: 1; }
.tr-band { fill: var(--accent-soft); }
.tr-lln { stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
.tr-line { stroke: var(--chart-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.tr-pt { fill: var(--chart-1); stroke: var(--surface); stroke-width: 2; }
.tr-cur { stroke: var(--ink-2); stroke-width: 1.5; }
.tr-cross { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 2 3; pointer-events: none; }
.tr-hl { fill: none; stroke: var(--ink); stroke-width: 1.5; pointer-events: none; }
.tr-tip { position: absolute; z-index: 3; pointer-events: none; display: grid; gap: 1px; padding: 6px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 6px 18px rgba(8, 20, 26, 0.18); font-size: 12.5px; line-height: 1.35; white-space: nowrap; max-width: 100%; }
.tr-tip b { font-weight: 650; }
.tr-tip .mut { color: var(--muted); }
.tr-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.tr-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.tr-legend i { display: inline-block; flex: none; }
.lg-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--chart-1); }
.lg-sq { width: 10px; height: 10px; border-radius: 2px; background: var(--chart-1); }
.lg-ring { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--ink-2); }
.lg-band { width: 16px; height: 10px; background: var(--accent-soft); border: 1px solid var(--line-strong); }
.lg-lln { width: 18px; height: 0; border-top: 1.5px dashed var(--muted); }
.tr-tbl-box { margin-top: 10px; }
.tr-tbl-wrap { overflow-x: auto; }
.tr-tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tr-tbl th, .tr-tbl td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tr-tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.tr-tbl .n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---- Learn ---- */
.learn { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.learn-side { display: grid; gap: 8px; align-content: start; min-width: 0; }
.learn-toggle { justify-self: start; }
.learn-nav { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 12px; }
.learn-nav.open { display: block; }
.ln-group h3 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 12px 0 4px; }
.ln-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.ln-btn { width: 100%; text-align: left; padding: 6px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-size: 13.5px; line-height: 1.3; }
.ln-btn:hover { background: var(--surface-2); }
.ln-btn[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
@media (min-width: 900px) {
  .learn { grid-template-columns: 250px minmax(0, 1fr); align-items: start; }
  .learn-toggle { display: none; }
  .learn-nav { display: block; }
  .learn-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); max-height: calc(100vh - 24px); overflow: auto; }
}
.learn-body { display: grid; gap: 10px; align-content: start; }
.learn-body .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.learn-body h3 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 14px; }
.learn-body p, .learn-body li { font-size: 15px; line-height: 1.6; color: var(--ink); max-width: 76ch; }
.learn-body p.fine { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.learn-body ul, .learn-body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.learn-body .step-head .intro { font-size: 16px; }
.learn-body .nav { margin-top: 20px; }
.learn-go { margin-top: 6px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
.edu-tbl { border-collapse: collapse; width: 100%; min-width: 440px; font-size: 13.5px; }
.edu-tbl th, .edu-tbl td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
.edu-tbl tr:last-child th, .edu-tbl tr:last-child td { border-bottom: 0; }
.edu-tbl thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.edu-tbl tbody th { font-weight: 600; color: var(--ink); }
.edu-tbl td.n { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.terms { display: grid; gap: 6px; }
.term { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.term > summary { cursor: pointer; padding: 9px 12px; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.term > summary::-webkit-details-marker { display: none; }
.term > summary::before { content: '▸'; color: var(--muted); font-size: 12px; margin-right: -2px; }
.term[open] > summary::before { content: '▾'; }
.term .tf { font-size: 13px; color: var(--muted); }
.term .tb { padding: 0 12px 12px 28px; display: grid; gap: 6px; }
.term .tb p { font-size: 14px; line-height: 1.55; }
.lbl { font-weight: 650; color: var(--ink-2); }
.term.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.srcs { color: var(--muted); }
.srcs li { font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.codes-tbl .code { font-size: 12px; }
.learn-loops { margin-top: 4px; }

/* ---- case bank ---- */
.bank-save { display: grid; gap: 10px; margin-top: 14px; padding: 14px; border: 1px dashed var(--line-strong); border-radius: 8px; background: var(--surface-2); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
.stat { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.stat .sv { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .sl { font-size: 12.5px; color: var(--muted); }
.stat .ss { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.h2s { font-size: 18px; font-weight: 650; }
.h3s { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 12px; }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.bar-row .bt { height: 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar-row .bf { display: block; height: 100%; background: var(--chart-1); border-radius: 3px; }
.bar-row .bv { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.bank-list { display: grid; gap: 10px; margin-top: 12px; }
.bank-case { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.bc-top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.bc-sum { font-family: var(--font-doc); font-size: 15px; line-height: 1.5; max-width: 80ch; }
.bc-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.rv { display: grid; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.rv-status { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.rv-detail { display: grid; gap: 8px; }
.empty-note { color: var(--muted); font-size: 14px; padding: 8px 2px; }
.sim { display: grid; gap: 8px; }
.sim h2 { font-size: 20px; font-weight: 650; }
.sim-msg { font-size: 14.5px; color: var(--ink); max-width: 80ch; }
.sim-list { display: grid; gap: 10px; }
.sim-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; justify-items: start; }
.sim-top { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.sim-sum { font-family: var(--font-doc); font-size: 14.5px; line-height: 1.5; }
.sim-note { font-size: 13.5px; color: var(--ink-2); }
.card .bar h2.h2s { margin-right: auto; }
@media (max-width: 560px) { .hu-item[data-lvl="tip"] { margin-inline: -18px; } .bar-row { grid-template-columns: 90px 1fr auto; } }

/* ---- print / save as PDF: the report alone, on white paper, whichever theme is on screen ---- */
@page { margin: 14mm 16mm; }
@media print {
  :root:root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F3F6F7; --ink: #111A1E; --ink-2: #2E3C42; --muted: #55656D;
    --line: #C9D2D6; --line-strong: #98A7AE; --accent: #0A6870; --accent-ink: #FFFFFF; --accent-soft: #DCEEEF; --chart-1: #0086A0;
    --c-wnl: #1C7448; --c-wnl-bg: #E0F1E7; --c-bl: #7F6500; --c-bl-bg: #FAF0C6; --c-mild: #9B5A00; --c-mild-bg: #FCE8C6;
    --c-mod: #B0420A; --c-mod-bg: #FADCCB; --c-sev: #A51F19; --c-sev-bg: #F6D2CF; --c-high: #34509E; --c-high-bg: #DCE3F6;
    color-scheme: light;
  }
  body { background: #FFFFFF; font-size: 12pt; }
  .app { max-width: none; padding: 0; }
  .top, .steps, .toast, .pop, .pv, .noprint, .learn-side, .learn-go, .learn .nav, .bn { display: none !important; }
  body:has(#doc) .main > :not(#doc) { display: none !important; }
  .doc { border: 0; border-radius: 0; padding: 0; }
  .doc .sec, .doc .interp li, .doc .codes-row { break-inside: avoid; }
  .doc .interp { break-inside: avoid-page; }
  .card { box-shadow: none; }
  a { color: inherit; text-decoration: none; }
}

/* ---- live report preview (wide screens): forms on the left, the report as it will read on the right ---- */
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.pv { display: none; }
.pv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.pv-head h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.pv-btns { display: flex; gap: 6px; }
.pv-doc { padding: 16px 18px; border-radius: 10px; position: relative; }
.pv-doc .dt { font-size: 11px; }
.pv-doc .meta { font-size: 12px; padding-bottom: 10px; }
.pv-doc .sec { margin-top: 12px; padding-left: 10px; border-left: 3px solid transparent; gap: 3px; }
.pv-doc .sec.cur { border-left-color: var(--accent); }
.pv-doc .sec h3 { font-size: 11px; }
.pv-doc .sec p, .pv-doc .interp .pv-empty { font-size: 14.5px; line-height: 1.55; }
.pv-doc .pv-empty { color: var(--muted); font-family: var(--font-ui); font-size: 13px; font-style: normal; }
.pv-doc .interp { margin-top: 16px; padding-top: 10px; }
.pv-doc .interp h3 { font-size: 11px; margin-bottom: 6px; }
.pv-doc ol { gap: 6px; }
.pv-doc ol li { font-size: 14.5px; line-height: 1.5; }
.pv-doc .codes-row { margin-top: 10px; }
@keyframes pvflash { from { background: var(--accent-soft); } to { background: transparent; } }
.pv-doc .sec.chg p, .pv-doc li.chg { animation: pvflash 1.4s ease-out; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { .pv-doc .sec.chg p, .pv-doc li.chg { animation: none; } }
@media (min-width: 1120px) {
  .app { max-width: 1360px; }
  .work:not(.has-pv) > .main { max-width: 1048px; }
  .work.has-pv { grid-template-columns: minmax(0, 1fr) minmax(360px, 420px); align-items: start; }
  .work.has-pv .pv { display: flex; flex-direction: column; position: sticky; top: calc(var(--steps-h, 52px) + 8px + env(safe-area-inset-top, 0px));
    height: calc(100vh - 150px); max-height: 900px; padding-top: 6px; }

<script>
/* ==========================================================================
   PFT Interpreter engine — part 1: constants, helpers, schema, state
   Spine: ERS/ATS 2022 technical standard on interpretive strategies
          (z-scores / LLN), the adult PFT phrase catalog v1.0.0 (handed over
          with PFT_Rules_and_Integration.txt; original wording anchored to the
          2022/2019/2023/2017 standards), Annals ATS 2025 codes (S/V/D),
          ATS/ERS 2019 spirometry grading, Kaminsky 2018 (muscle, challenge,
          6MWT, CPET) and Owens 1987 (isolated low RV).
   Rule of the engine: a measurement state is computed before any wording is
   chosen; unknown never becomes normal; quality gates classification.
   ========================================================================== */
(function (root) {
'use strict';

const Z_LLN = -1.645, Z_ULN = 1.645;
const CFG = { band: 0.25 };          // "near LLN" review flag = within this many SD above the LLN (a local convention, never a category)
const STYLES = ['concise', 'standard', 'expanded', 'numeric'];   // wording levels of the phrase catalog

/* ------------------------------------------------------------------ utils */
function num(v) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v).trim().replace(/[−‒–—]/g, '-').replace(/\s+/g, '');
  if (s === '' || s === '-' || s === '.' || s === '+') return NaN;
  s = s.replace(',', '.');
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const has = (x) => typeof x === 'number' && isFinite(x);
function r1(x) { return Math.round(x * 10) / 10; }
function fmt(x, d) {
  if (!has(x)) return '';
  const k = (d === undefined) ? 1 : d;
  let s = x.toFixed(k);
  if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s;
}
function fz(z) { const s = fmt(z, 1); return (z > 0 && s !== '0.0') ? '+' + s : s; }
function fsign(x, d) { const s = fmt(x, d); return (x > 0 && !/^0(\.0*)?$/.test(s)) ? '+' + s : s; }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function sentence(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (!/^[a-z][A-Z]/.test(s)) s = cap(s);      // keep "pH", "mL" etc. as written
  return /[.!?]$/.test(s) ? s : s + '.';
}
function ageInterp(lo, hi, age, a0, a1) { // linear interpolation helper
  if (age <= a0) return lo;
  if (age >= a1) return hi;
  return lo + (hi - lo) * (age - a0) / (a1 - a0);
}

/* ---------------------------------------------------- category machinery */
function sevFromZ(z) { return z >= -2.5 ? 'mild' : (z >= -4.0 ? 'mod' : 'sev'); }

function catFromZ(z, kind) {
  const hasBL = (kind === 'grade' || kind === 'gradeH' || kind === 'ratio');
  if (z > Z_ULN) return (kind === 'lo') ? 'wnl' : 'high';
  if (z >= Z_LLN) {
    if (hasBL && CFG.band > 0 && z < Z_LLN + CFG.band) return 'bl';
    return 'wnl';
  }
  if (kind === 'hi') return 'wnl';
  if (kind === 'grade' || kind === 'gradeH') return sevFromZ(z);
  return 'low';
}

/* Resolve a parameter state {c, z} -> fact object. A numeric z always overrides the button.
   rel is the documented reliability of that measurement: 'ok' | 'limited' | 'invalid'. An invalid measurement keeps
   its number for display but has state 'invalid' and never drives a pattern. Unknown ('nm') is never normal. */
function res(p, kind, rel) {
  p = p || {};
  const z = num(p.z);
  let cat = (p.c && p.c !== '') ? p.c : 'nm';
  const hz = has(z);
  if (hz) cat = catFromZ(z, kind);
  rel = rel || 'ok';
  const measured = cat !== 'nm';
  const invalid = measured && rel === 'invalid';
  const low = !invalid && (cat === 'mild' || cat === 'mod' || cat === 'sev' || cat === 'low');
  const sev = invalid ? null : (cat === 'mild' ? 'mild' : cat === 'mod' ? 'moderate' : cat === 'sev' ? 'severe' : null);
  const state = !measured ? 'not_measured' : (invalid ? 'invalid' : (low ? 'low' : (cat === 'high' ? 'high' : 'normal')));
  return {
    kind: kind, cat: invalid ? 'inv' : cat, raw: cat, z: hz ? z : null, measured: measured, rel: rel, limited: measured && rel === 'limited',
    state: state, invalid: invalid,
    low: low, high: !invalid && cat === 'high', bl: !invalid && cat === 'bl', wnl: !invalid && (cat === 'wnl' || cat === 'bl'),
    grade: invalid ? 0 : (({ mild: 1, mod: 2, sev: 3 })[cat] || 0), sev: sev,
    sevState: !measured || invalid ? 'unknown' : (sev || ((kind === 'grade' || kind === 'gradeH') ? 'preserved' : 'unknown')),
    zTxt: hz ? 'z = ' + fz(z) : ''
  };
}
function zp(r) { return r && r.zTxt ? ' (' + r.zTxt + ')' : ''; }

/* "FEV1 is moderately reduced (z = -3.1)" */
function describe(name, r) {
  if (!r || !r.measured) return '';
  let t;
  if (r.invalid) return name + ' is not interpretable (the maneuver did not meet quality criteria)' + zp(r);
  if (r.cat === 'wnl') t = 'is within normal limits';
  else if (r.cat === 'bl') t = 'is within normal limits but borderline (close to the LLN)';
  else if (r.cat === 'mild') t = 'is mildly reduced';
  else if (r.cat === 'mod') t = 'is moderately reduced';
  else if (r.cat === 'sev') t = 'is severely reduced';
  else if (r.cat === 'low') t = 'is below the LLN';
  else if (r.cat === 'high') t = 'is above the ULN';
  else t = 'is recorded';
  return name + ' ' + t + zp(r);
}
function sevWord(r) { return r && r.sev ? r.sev : (r && r.low ? 'reduced' : ''); }

/* ----------------------------------------------------------------- schema
   Field types: param(kind) | num | sel | chk | txt | date
   Kinds: grade (nm,wnl,bl,mild,mod,sev) | gradeH (+high) | ratio (nm,wnl,bl,low,high)
          both (nm,low,wnl,high) | hi (nm,wnl,high) | lo (nm,wnl,low)                     */
const KIND_OPTS = {
  grade:  [['nm', 'Not measured'], ['wnl', 'WNL'], ['bl', 'Near LLN'], ['mild', 'Mild ↓'], ['mod', 'Moderate ↓'], ['sev', 'Severe ↓']],
  gradeH: [['nm', 'Not measured'], ['wnl', 'WNL'], ['bl', 'Near LLN'], ['mild', 'Mild ↓'], ['mod', 'Moderate ↓'], ['sev', 'Severe ↓'], ['high', 'Above ULN ↑']],
  ratio:  [['nm', 'Not measured'], ['wnl', 'WNL'], ['bl', 'Near LLN'], ['low', 'Below LLN ↓'], ['high', 'Above ULN ↑']],
  both:   [['nm', 'Not measured'], ['low', 'Below LLN ↓'], ['wnl', 'WNL'], ['high', 'Above ULN ↑']],
  hi:     [['nm', 'Not measured'], ['wnl', 'WNL'], ['high', 'Above ULN ↑']],
  lo:     [['nm', 'Not measured'], ['wnl', 'WNL'], ['low', 'Below LLN ↓']]
};

/* Test catalogue (first screen) */
const TESTS = [
  { key: 'spiro',  group: 'Spirometry',            name: 'Spirometry',                       desc: 'FEV1, FVC, FEV1/FVC, quality grade' },
  { key: 'bd',     group: 'Spirometry',            name: 'Bronchodilator response',          desc: 'Pre/post FEV1 and FVC' },
  { key: 'fvl',    group: 'Spirometry',            name: 'Flow–volume loop',                 desc: 'Loop shape, PEF, FEV1/PEF, FIF50/FEF50' },
  { key: 'vol',    group: 'Volumes & gas transfer', name: 'Lung volumes',                    desc: 'TLC, RV, RV/TLC, FRC, SVC' },
  { key: 'dlco',   group: 'Volumes & gas transfer', name: 'DLCO / KCO / VA',                 desc: 'Single-breath diffusing capacity, Hb adjustment' },
  { key: 'raw',    group: 'Volumes & gas transfer', name: 'Airway resistance (Raw / sGaw)',  desc: 'Plethysmographic resistance' },
  { key: 'osc',    group: 'Volumes & gas transfer', name: 'Oscillometry (FOT / IOS)',        desc: 'R5, R5–R20, X5, AX, Fres' },
  { key: 'mip',    group: 'Muscle & posture',      name: 'MIP / MEP / SNIP',                 desc: 'Respiratory muscle strength, cough peak flow, MVV' },
  { key: 'post',   group: 'Muscle & posture',      name: 'Upright vs. supine',               desc: 'Postural FVC change, orthodeoxia' },
  { key: 'feno',   group: 'Airway biomarkers',     name: 'FeNO',                             desc: 'Fractional exhaled nitric oxide' },
  { key: 'bronch', group: 'Airway biomarkers',     name: 'Bronchoprovocation',               desc: 'Methacholine, mannitol, exercise, EVH' },
  { key: 'sixmw',  group: 'Exercise & gas exchange', name: '6-minute walk test',             desc: 'Distance, desaturation, HR recovery' },
  { key: 'cpet',   group: 'Exercise & gas exchange', name: 'Cardiopulmonary exercise test',  desc: 'Peak VO2, reserves, gas-exchange pattern' },
  { key: 'gas',    group: 'Exercise & gas exchange', name: 'Arterial blood gas',             desc: 'pH, PaCO2, PaO2, A–a gradient' },
  { key: 'prior',  group: 'Comparison',            name: 'Comparison with prior PFT(s)',     desc: '% change, annualised decline, thresholds' }
];

const PRESETS = [
  { name: 'Full PFT',                    tests: ['spiro', 'fvl', 'vol', 'dlco'] },
  { name: 'Spirometry only',             tests: ['spiro', 'fvl'] },
  { name: 'Spirometry + BD',             tests: ['spiro', 'fvl', 'bd'] },
  { name: 'Spiro + BD + volumes + FeNO', tests: ['spiro', 'fvl', 'bd', 'vol', 'feno'] },
  { name: 'ILD work-up',                 tests: ['spiro', 'fvl', 'vol', 'dlco', 'sixmw', 'prior'] },
  { name: 'Neuromuscular',               tests: ['spiro', 'fvl', 'vol', 'mip', 'post'] },
  { name: 'Asthma: spiro + BD + FeNO',   tests: ['spiro', 'fvl', 'bd', 'feno'] },
  { name: 'Methacholine challenge',      tests: ['spiro', 'fvl', 'bronch'] },
  { name: 'Pre-op: spiro + DLCO',        tests: ['spiro', 'fvl', 'dlco'] },
  { name: 'Exercise: 6MWT + CPET',       tests: ['sixmw', 'cpet'] }
];

const P = (id, label, kind, extra) => Object.assign({ id: id, label: label, type: 'param', kind: kind }, extra || {});
const N = (id, label, unit, extra) => Object.assign({ id: id, label: label, type: 'num', unit: unit || '' }, extra || {});
const S = (id, label, opts, extra) => Object.assign({ id: id, label: label, type: 'sel', opts: opts }, extra || {});
const C = (id, label, extra) => Object.assign({ id: id, label: label, type: 'chk' }, extra || {});
const T = (id, label, extra) => Object.assign({ id: id, label: label, type: 'txt' }, extra || {});
const M = (id, label, groups, extra) => Object.assign({ id: id, label: label, type: 'multi', groups: groups, opts: groups.reduce((a, g) => a.concat(g.opts), []) }, extra || {});
const NR = ['', 'Not entered'];      // blank first option

/* Common reasons PFTs are ordered (tap to select; anything else goes in the free-text box) */
const INDICATIONS = [
  { title: 'Most common reasons', opts: [
    ['dyspnea', 'Dyspnea'], ['cough', 'Chronic cough'], ['wheeze', 'Wheeze / chest tightness'], ['asthma', 'Asthma'], ['copd', 'COPD / emphysema'],
    ['ild', 'Interstitial lung disease'], ['preop', 'Pre-operative evaluation'], ['fu', 'Follow-up of known lung disease']] },
  { title: 'Other symptoms and findings', opts: [
    ['hypox', 'Unexplained hypoxemia'], ['imaging', 'Abnormal chest imaging'], ['postcovid', 'Post-COVID / post-infection']] },
  { title: 'Other known or suspected disease', opts: [
    ['sarc', 'Sarcoidosis'], ['ctd', 'Connective-tissue disease'], ['cf', 'Cystic fibrosis'], ['bronchiectasis', 'Bronchiectasis'],
    ['ph', 'Pulmonary hypertension'], ['nmd', 'Neuromuscular disease'], ['chestwall', 'Chest wall / obesity / kyphoscoliosis']] },
  { title: 'Risk, monitoring and other', opts: [
    ['drug', 'Drug-toxicity monitoring'], ['occ', 'Occupational / environmental exposure'], ['tx', 'Lung transplant evaluation / follow-up'],
    ['onc', 'Before / after chemotherapy or radiation'], ['screen', 'Smoking-related risk / lung-cancer screening'], ['disab', 'Impairment / disability evaluation']] }
];

/* Flow–volume loop gallery (drawn in the interface). Keys are stored in fvl.loop. Elements: key, name, teaching caption, plain visual description (used in the report). */
const LOOPS = [
  ['normal',  'Normal',                            'Sharp early peak, then a near-straight descent; smooth rounded inspiratory limb.', 'Rapid rise to a sharp peak, a near-straight descending limb and a smooth, rounded inspiratory limb'],
  ['concave', 'Obstruction (mild–moderate)',       'Concave, “scooped” descent after the peak: airflow obstruction, small-airway dysfunction or loss of elastic recoil.', 'Concave (scooped) descending limb of the expiratory curve after the peak'],
  ['sevobs',  'Severe obstruction / emphysema',    'Low early peak, marked scooping and a long low-flow tail; usually with air trapping.', 'Low early peak with marked scooping of the expiratory limb and a long low-flow tail'],
  ['convex',  'Restriction pattern',               'Small, tall, narrow loop: flows preserved or relatively high for a small volume (convex-upward limb).', 'Small, tall, narrow loop with a steep, convex-upward expiratory limb; flows are relatively preserved for the volume'],
  ['effort',  'Submaximal effort',                 'Rounded, late or blunted peak with an irregular curve; efforts do not reproduce.', 'Blunted or late peak with an irregular curve; the efforts do not reproduce'],
  ['slow',    'Hesitant (slow) start',             'Gradual rise to a late, low, rounded peak: the maneuver started slowly, so FEV1 and PEF are underestimated; check the back-extrapolated volume.', 'Slow rise to a late, low, rounded peak (hesitant start)'],
  ['weak',    'Muscle weakness',                   'Low rounded peak and a weak inspiratory limb: both limbs reduced, no sharp PEF.', 'Low rounded peak flow with a reduced inspiratory limb and no sharp peak'],
  ['expflat', 'Variable intrathoracic obstruction', 'Expiratory plateau (flow capped) with a normal inspiratory limb: tracheal tumor, tracheomalacia.', 'Plateau (flat top) of the expiratory limb with a preserved inspiratory limb'],
  ['inspflat', 'Variable extrathoracic obstruction', 'Inspiratory plateau with a preserved expiratory limb: vocal-cord dysfunction or paralysis, goiter.', 'Plateau (flat top) of the inspiratory limb with a preserved expiratory limb'],
  ['bothflat', 'Fixed upper-airway obstruction',   'Both limbs plateau, giving a box-like loop: tracheal stenosis or another fixed lesion.', 'Plateau of both limbs, giving a box-like loop'],
  ['saw',     'Saw-tooth',                         'Rapid oscillations on a limb: floppy airway wall, tremor, neuromuscular disease or sleep apnea.', 'Saw-tooth oscillations on a limb'],
  ['unilat',  'Biphasic expiration',               'Two-phase expiratory limb: unilateral main-bronchus obstruction or single-lung transplant.', 'Biphasic (two-phase) expiratory limb'],
  ['cough',   'Cough artifact',                    'Sharp spike or notch early in expiration; can lower FEV1 falsely, so repeat the maneuver.', 'Sharp spike or notch early in expiration'],
  ['early',   'Early termination',                 'Exhalation stops while flow is still high; FVC and FEV1/FVC are then unreliable.', 'Exhalation ends while flow is still high, with no plateau at the end']
];

const Q_OPTS = [['', 'Not graded'], ['A', 'A'], ['B', 'B'], ['C', 'C'], ['D', 'D'], ['E', 'E'], ['U', 'U'], ['F', 'F']];
const QC_OPTS = [['', 'Acceptable'], ['limited', 'Technical factors reduce confidence'], ['inv', 'Not interpretable']];
/* Documented maneuver limitations (ATS/ERS 2019 acceptability criteria). Each one limits a named component; none is inferred from a number. */
const LIMITS = [
  { title: 'Documented limitations (tap what the lab or the tracing shows)', opts: [
    ['repeat', 'Repeatability not met (FEV1 or FVC differ by more than 150 mL)'], ['early', 'Early termination (FVC may be underestimated)'],
    ['cough', 'Cough in the first second (FEV1 affected)'], ['insp', 'Incomplete inspiration (volumes underestimated)'], ['slow', 'Slow or hesitant start'],
    ['leak', 'Mouth leak'], ['glottic', 'Glottic closure'], ['varef', 'Variable effort between maneuvers'], ['fatigue', 'Testing limited by fatigue'], ['symptom', 'Testing limited by symptoms']] }
];
const HB_BASIS = [['', 'Not stated on the report'], ['un', 'Not adjusted for hemoglobin'], ['adj', 'Hemoglobin-adjusted']];
const HELD_OPTS = [['', 'Not recorded'], ['y', 'Withheld as required'], ['n', 'Not withheld']];
const ICS_OPTS = [['', 'Not recorded'], ['y', 'On corticosteroids'], ['n', 'Not on corticosteroids']];

const SCHEMA = {
  ctx: {
    title: 'Study details', src: 'ATS 2023 and ERS/ATS 2022 reference-set recommendations. No patient identifiers are collected.',
    groups: [
      { title: 'Study', fields: [
        { id: 'date', label: 'Date of study', type: 'date' },
        M('indic', 'Indication(s): tap all that apply', INDICATIONS),
        T('indication', 'Other indication (type only if not listed above)', { ph: 'e.g. recurrent pneumonia, pre-bariatric surgery' })
      ] },
      { title: 'Patient', fields: [
        N('age', 'Age', 'years', { min: 0, max: 120, step: 1 }),
        S('sex', 'Sex (as used for reference values)', [['', 'Not entered'], ['M', 'Male'], ['F', 'Female']]),
        S('smoke', 'Smoking status', [['', 'Not entered'], ['never', 'Never'], ['former', 'Former'], ['current', 'Current']])
      ] },
      { title: 'Height and weight (optional, for BMI)', opt: true, fields: [
        N('ht', 'Height', 'cm', { min: 50, max: 230, step: 0.5 }),
        N('wt', 'Weight', 'kg', { min: 5, max: 400, step: 0.5 })
      ] },
      { title: 'Reference equations (the recommended option is already selected)', opt: true, fields: [
        S('ref_spiro', 'Spirometry reference set', [['global', 'GLI Global, race-neutral (recommended, ATS 2023)'], ['gli2012', 'GLI-2012 (race-specific)'], ['other', 'Other / lab-specific']], { stack: true, hint: 'ATS 2023: race-neutral GLI Global replaces race-specific sets; the lab report decides which set produced the z-scores you enter' }),
        S('ref_vol', 'Lung-volume reference set', [['gli2021', 'GLI-2021 (recommended)'], ['other', 'Other / lab-specific']], { stack: true, hint: 'ERS/ATS 2022 recommends GLI-2021 volumes; no race adjustment (ATS 2023)' }),
        S('ref_dlco', 'DLCO reference set', [['gli2017', 'GLI-2017 (recommended)'], ['other', 'Other / lab-specific']], { stack: true, hint: 'ERS/ATS 2022 recommends GLI-2017 DLCO' }),
        S('hrmax_eq', 'Predicted maximal heart rate (6MWT and CPET)', [['tanaka', 'Tanaka: 208 − 0.7 × age (recommended)'], ['fox', '220 − age']], { stack: true, hint: 'Tanaka (meta-analysis of 351 studies, 18,712 subjects) fits better than 220 − age, which overestimates in older adults' }),
        S('aa_eq', 'Expected upper limit of the A–a gradient on room air', [['q4', 'Age/4 + 4'], ['p10', '(Age + 10)/4']], { stack: true, hint: 'Both are in clinical use; no single equation is clearly the better validated one, so borderline values are flagged' })
      ] }
    ]
  },

  spiro: {
    title: 'Spirometry', src: 'ERS/ATS 2022 Fig 8 & Table 5; Annals ATS 2025 Table 1 (S-codes); ATS/ERS 2019 quality grades.',
    intro: 'Tap a category for each index (or type a z-score in the small box). Order of reasoning: FEV1/FVC against the LLN, then the FEV1 z-score for severity, then the FVC for other pathology.',
    groups: [
      { title: 'Indices vs. reference (pre-bronchodilator)', quick: ['ratio', 'fev1', 'fvc'], fields: [
        P('ratio', 'FEV1/FVC', 'ratio', { hint: 'Below the LLN (z < −1.645) = airflow obstruction' }),
        P('fev1', 'FEV1', 'grade', { hint: 'z-score sets the severity of the impairment' }),
        P('fvc', 'FVC', 'gradeH', { hint: 'Low FVC with a low ratio = air trapping or coexisting restriction; needs lung volumes' }),
        P('fef', 'FEF25–75% (informational)', 'both', { hint: 'Not used to define obstruction or severity (ERS/ATS 2022)' })
      ] },
      { title: 'Quality (graded separately for FEV1 and FVC)', fields: [
        S('qual_fev1', 'FEV1 grade', Q_OPTS, { hint: 'ATS/ERS 2019: A–B good; C–E usable, reduced confidence; U usable only; F not usable' }),
        S('qual_fvc', 'FVC grade', Q_OPTS, { hint: 'A cough in the first second can spoil FEV1 while FVC stays usable, and early termination spoils FVC while FEV1 stays usable' }),
        S('effort', 'Effort / cooperation', [['', 'Adequate'], ['poor', 'Submaximal effort'], ['weak', 'Weakness suspected']]),
        M('limits', 'Limitations noted on the report', LIMITS, { hint: 'Only tap what is documented; the interpretation states which component each limitation affects' })
      ] },
      { title: 'Measured values (optional)', opt: true, fields: [
        N('fev1_abs', 'FEV1', 'L', { min: 0, max: 8, step: 0.01 }),
        N('fvc_abs', 'FVC', 'L', { min: 0, max: 10, step: 0.01 }),
        N('fev1_pct', 'FEV1', '% pred', { min: 0, max: 200, step: 1 }),
        N('fvc_pct', 'FVC', '% pred', { min: 0, max: 200, step: 1 })
      ] }
    ]
  },

  bd: {
    title: 'Bronchodilator response', src: 'ERS/ATS 2022 Box 1 (response = change > 10% of the predicted value in FEV1 and/or FVC); Annals ATS 2025 S61/S62.',
    intro: 'Tap what the lab report states. Typed pre/post values (under “optional”) are only needed if you want the change calculated.',

    put('diffusion_patterns.low_dlco_low_va_low_kco', low && known(VA) && known(K) && VA.low && K.low);
    put('diffusion_patterns.low_dlco_low_va_normal_kco', low && known(VA) && known(K) && VA.low && K.wnl);

      else put('observations.dlco.hb_unknown', true);

      if (d.unadjRes.measured && d.unadjRes.low && d.adj.measured && d.adj.wnl) put('observations.dlco.normalized_with_hb', true);

    put('muscle_patterns.both_normal', known(m.mip) && known(m.mep) && m.mip === 'normal' && m.mep === 'normal');
    put('muscle_patterns.mip_low_mep_preserved', known(m.mip) && known(m.mep) && m.mip === 'low' && m.mep === 'normal');

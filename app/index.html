    vemvv: num(cp.ve_mvv), slope: num(cp.vevco2), nadir: num(cp.vevco2_nadir), petco2: num(cp.petco2), vtic: num(cp.vtic),
    s0: num(cp.spo2_rest), sp: num(cp.spo2_peak), rer: num(cp.rer), bd: num(cp.borg_d), bl: num(cp.borg_l), lac: num(cp.lactate),
    effort: cp.effort || '', vo2c: cp.vo2_c || '', ltc: cp.lt_c || '', rerc: cp.rer_c || '', hrc: cp.hr_c || '', o2pc: cp.o2p_c || '', hrrc: cp.hrr_c || '',
    ventc: cp.vent_c || '', slopec: cp.slope_c || '', petco2c: cp.petco2_c || '', desatc: cp.desat_c || ''
  };
  const k = f.cp;
  if (!has(k.hrpct) && has(k.hrp) && has(f.ctx.hrMax) && f.ctx.hrMax > 0) k.hrpct = k.hrp / f.ctx.hrMax * 100;
  k.anyCat = [k.effort, k.vo2c, k.ltc, k.rerc, k.hrc, k.o2pc, k.hrrc, k.ventc, k.slopec, k.petco2c, k.desatc].some(x => x !== '');
  k.any = has(k.vo2pct) || has(k.vo2) || has(k.lt) || has(k.hrp) || has(k.o2p) || has(k.vemvv) || has(k.slope) || has(k.nadir) || has(k.sp) || has(k.rer) || k.anyCat;

  const ga = blankIf(on, st, 'gas');
  f.gas = { ph: num(ga.ph), pco2: num(ga.paco2), po2: num(ga.pao2), hco3: num(ga.hco3), sao2: num(ga.sao2), fio2: num(ga.fio2), patm: num(ga.patm), cohb: num(ga.cohb),
            phC: ga.ph_c || '', co2C: ga.co2_c || '', hco3C: ga.hco3_c || '', o2C: ga.o2_c || '', fioC: ga.fio2_c || '', aaC: ga.aa_c || '' };
  const g = f.gas;
  g.fi = has(g.fio2) ? g.fio2 : 0.21; g.pb = has(g.patm) ? g.patm : 760;
  g.onO2 = has(g.fio2) ? g.fio2 > 0.21 : g.fioC === 'o2';
  g.aa = (has(g.po2) && has(g.pco2) && !(g.fioC === 'o2' && !has(g.fio2))) ? (g.fi * (g.pb - 47) - g.pco2 / 0.8) - g.po2 : NaN;
  g.aaMax = has(age) ? (f.ctx.eq.aa === 'p10' ? (age + 10) / 4 : age / 4 + 4) : NaN;
  g.phCat = has(g.ph) ? (g.ph < 7.35 ? 'acid' : (g.ph > 7.45 ? 'alk' : 'nl')) : g.phC;
  g.co2Cat = has(g.pco2) ? (g.pco2 > 45 ? 'hyper' : (g.pco2 < 35 ? 'hypo' : 'nl')) : g.co2C;
  g.hco3Cat = has(g.hco3) ? (g.hco3 > 26 ? 'hi' : (g.hco3 < 22 ? 'lo' : 'nl')) : g.hco3C;
  g.o2Cat = has(g.po2) ? (g.po2 < 60 ? 'hyp' : (g.po2 < 80 ? 'mild' : 'nl')) : g.o2C;
  g.hypoxC = g.o2Cat === 'hyp' && !g.onO2;
  g.hyperC = g.co2Cat === 'hyper';
  g.any = has(g.ph) || has(g.pco2) || has(g.po2) || has(g.hco3) || has(g.sao2) || g.phC !== '' || g.co2C !== '' || g.hco3C !== '' || g.o2C !== '' || g.aaC !== '';

  f.priors = [];
  if (on.prior) f.priors = priorFacts(st, f);
  f.prior = { any: f.priors.some(p => p.metrics.length > 0) };

  // derived booleans used by several modules
  f.obstruct = f.sp.ratio.low;
  f.hasTLC = f.vol.tlc.measured;
  f.hasVolInfo = f.vol.tlc.measured || f.vol.rvtlc.measured || f.vol.rv.measured || f.vol.frctlc.measured;
  f.poorEffort = (f.sp.effort === 'poor' || f.sp.effort === 'weak');
  f.sp.pat = spiroPattern(f);
  f.vol.pat = volPattern(f);
  f.dl.pat = dlcoPattern(f);
  return f;
}

/* ---------------------------------------------------------- spirometry pattern */
function spiroPattern(f) {
  const s = f.sp, R = s.ratio, A = s.fev1, B = s.fvc;
  const P_ = { code: null, codes: [], phrase: '', addon: '', kind: 'none', lowFVC: false, lowFEV1: false, obstruct: false, noVolSuggest: false };
  if (!(R.measured || A.measured || B.measured)) return P_;
  const noTLC = !f.hasTLC;
  P_.lowFEV1 = A.low; P_.lowFVC = B.low;
  const sevA = A.sev || 'reduced', sevB = B.sev || 'reduced';

  if (R.low) {
    P_.obstruct = true; P_.kind = 'obstruction';
    if (B.low) {
      if (f.poorEffort) {
        P_.code = 'S33'; P_.kind = 'effort';
        P_.phrase = 'Submaximal effort (or muscle weakness) is a likely explanation for the reduced spirometric values.';
      } else {
        P_.code = 'S32'; P_.kind = 'obstruction-lowFVC';
        P_.phrase = 'Spirometric pattern demonstrates obstructive impairment with air trapping or coexisting restrictive impairment.';
        if (noTLC) P_.addon = 'Lung volumes are needed to distinguish air trapping from coexisting restriction; consider obtaining lung volumes.';
        else if (f.vol.tlc.low) P_.addon = 'Reduced TLC indicates coexisting restriction (see lung volumes).';
        else P_.addon = 'TLC is not reduced, so the low FVC is attributable to air trapping rather than restriction (see lung volumes).';
      }
    } else if (B.high || A.high) {
      P_.code = 'S34'; P_.kind = 'dysanapsis';
      P_.phrase = 'Spirometric pattern suggests a possible obstructive impairment, although a normal variant or dysanaptic lung growth should be considered.';
    } else if (A.measured) {
      P_.code = A.cat === 'sev' ? 'S23' : (A.cat === 'mod' ? 'S22' : 'S21');
      const w = A.cat === 'sev' ? 'severe' : (A.cat === 'mod' ? 'moderate' : 'mild');
      P_.phrase = 'Spirometric pattern demonstrates ' + w + ' obstructive impairment.';
      if (B.wnl && noTLC) P_.addon = 'FVC is WNL, arguing against restrictive impairment.';
    } else {
      P_.code = 'S2'; P_.phrase = 'FEV1/FVC is below the LLN, consistent with airflow obstruction; FEV1 was not entered, so severity cannot be graded.';
    }
  } else if (R.measured) {
    P_.kind = 'noobstruct';
    if (A.low && B.low) {
      if (f.poorEffort) {
        P_.code = 'S33'; P_.kind = 'effort';
        P_.phrase = 'Submaximal effort (or muscle weakness) is a likely explanation for the reduced spirometric values.';
      } else {
        P_.code = 'S31'; P_.kind = 'nonspecific'; P_.noVolSuggest = noTLC;
        P_.phrase = 'Spirometric pattern demonstrates nonspecific ventilatory impairment.';
        if (noTLC) {
          P_.addon = 'There is a ' + sevA + ' reduction in FEV1 and a ' + sevB + ' reduction in FVC with a preserved FEV1/FVC, which is suggestive of restriction, but cannot definitively assess given no lung volumes; consider obtaining lung volumes. This may also reflect mild obstructive impairment with air trapping.';
        } else {
          P_.addon = f.vol.tlc.low ? 'Reduced TLC confirms restrictive impairment (see lung volumes).'
            : 'TLC is not reduced, so restriction is not demonstrated; the pattern may reflect mild obstructive impairment with air trapping (see lung volumes).';
        }
      }
    } else if (A.low) {
      P_.code = 'S41'; P_.kind = 'isolatedFEV1';
      P_.phrase = 'Spirometric pattern shows an isolated ' + sevA + ' reduction in FEV1.';
      P_.addon = 'This may represent an early ventilatory impairment.';
    } else if (B.low) {
      P_.code = 'S42'; P_.kind = 'isolatedFVC'; P_.noVolSuggest = noTLC;
      P_.phrase = 'Spirometric pattern shows isolated ' + sevB + ' reduction in FVC.';
      P_.addon = noTLC
        ? cap(sevB) + ' reduction in FVC which is suggestive of restriction, but cannot definitively assess given no lung volumes; consider obtaining lung volumes. May also represent an early ventilatory impairment.'
        : (f.vol.tlc.low ? 'Reduced TLC confirms restrictive impairment (see lung volumes).' : 'TLC is not reduced, so restriction is not demonstrated; this may represent an early ventilatory impairment.');
    } else if (A.wnl && B.wnl) {
      const bl = R.bl || A.bl || B.bl;
      const concave = s.loop === 'concave';
      if (bl) {
        P_.code = 'S11'; P_.kind = 'borderline';
        P_.phrase = 'Spirometric values are borderline low and significance is uncertain.';
        P_.addon = 'This may represent a very mild ventilatory impairment or be a normal variant.';
        if (concave) { P_.codes.push('S10'); }
      } else if (concave) {
        P_.code = 'S10'; P_.kind = 'concave';
        P_.phrase = 'Spirometric indices are WNL but concavity of the flow-volume loop could suggest mild obstructive impairment at low lung volumes or loss of elastic recoil.';
        P_.addon = noTLC ? 'FVC is WNL, arguing against restrictive impairment.' : '';
      } else {
        P_.code = 'S1'; P_.kind = 'normal';
        P_.phrase = 'Normal spirometry. No obstructive impairment demonstrated.';
        P_.addon = noTLC ? 'FVC is WNL, arguing against restrictive impairment.' : '';
      }
    } else {
      // e.g. FEV1/FVC wnl, only one index entered, or FVC high
      P_.kind = 'partial';
      if (A.measured && A.wnl && !B.measured) P_.phrase = 'No obstructive impairment demonstrated; FVC was not entered, so restriction cannot be assessed from spirometry.';
      else if (B.measured && B.wnl && !A.measured) P_.phrase = 'No obstructive impairment demonstrated; FEV1 was not entered.';
      else if (B.high || A.high) P_.phrase = 'No obstructive impairment demonstrated; FVC' + (A.high && !B.high ? '/FEV1' : '') + ' is above the ULN (large lungs may be a normal variant).';
      else P_.phrase = 'No obstructive impairment demonstrated.';
    }
    if (R.high && !P_.addon && (B.low || A.low)) P_.addon = 'FEV1/FVC is above the ULN, which can accompany restriction.';
  } else {
    P_.kind = 'noratio';
    P_.phrase = 'FEV1/FVC was not entered; airflow obstruction cannot be assessed.' +
      ((A.low || B.low) ? ' The reduced ' + (A.low && B.low ? 'FEV1 and FVC' : (A.low ? 'FEV1' : 'FVC')) + ' cannot be classified without the ratio.' : '');
  }
  return P_;
}

/* ----------------------------------------------------------- volume pattern */
function volPattern(f) {
  const v = f.vol, R = f.sp.ratio, ob = R.low;
  const P_ = { code: null, codes: [], phrase: '', addon: '', kind: 'none', sev: null, trap: false, hyper: false, lowRV: false, obstruct: ob };
  if (!v.any) return P_;
  const T_ = v.tlc;
  const trapRVTLC = v.rvtlc.high || (!v.rvtlc.measured && v.rv.high);
  P_.trap = v.rvtlc.high || (!v.rvtlc.measured && v.rv.high);
  P_.hyper = T_.high || v.frc.high || v.frctlc.high || (v.rv.high && !T_.low);
  const obeseNote = f.ctx.obese ? 'Obesity may contribute to restrictive pattern.' : '';

  if (T_.low) {
    P_.sev = T_.cat === 'sev' ? 'severe' : (T_.cat === 'mod' ? 'moderate' : 'mild');
    const i = T_.cat === 'sev' ? 2 : (T_.cat === 'mod' ? 1 : 0);
    if (ob) {
      P_.kind = 'mixed'; P_.code = ['V13', 'V16', 'V19'][i];
      P_.phrase = 'Static lung volumes demonstrate ' + P_.sev + ' mixed obstructive and restrictive disorder.';
    } else if (trapRVTLC) {
      P_.kind = 'complex'; P_.code = ['V12', 'V15', 'V18'][i];
      P_.phrase = 'Static lung volumes demonstrate ' + P_.sev + ' complex restrictive impairment.';
      P_.addon = 'RV/TLC is elevated, which is often seen with a reduced FVC or SVC (for example weakness or chest-wall restriction).';
    } else {
      P_.kind = 'restriction'; P_.code = ['V11', 'V14', 'V17'][i];
      P_.phrase = 'Static lung volumes demonstrate ' + P_.sev + ' restrictive impairment.';
    }
    if (obeseNote) P_.addon = (P_.addon ? P_.addon + ' ' : '') + obeseNote;
    if (!R.measured) P_.addon = (P_.addon ? P_.addon + ' ' : '') + 'FEV1/FVC was not entered, so a coexisting obstructive component (mixed disorder) cannot be excluded.';
  } else if (T_.bl && !trapRVTLC) {
    P_.kind = 'borderline'; P_.code = 'V10';
    P_.phrase = 'Static lung volumes borderline low, significance uncertain.';
    P_.addon = 'May represent very mild ventilatory impairment or be a normal variant.';
  } else if (T_.high) {
    if (ob) { P_.kind = 'hyper'; P_.phrase = 'Static lung volumes demonstrate hyperinflation (TLC above the ULN)' + (P_.trap ? ' with air trapping.' : '.'); }
    else { P_.kind = 'large'; P_.phrase = 'TLC is above the ULN with a preserved FEV1/FVC, consistent with large lungs (may be a normal variant) or hyperinflation.'; }
  } else if (T_.wnl && trapRVTLC) {
    P_.kind = 'airtrap'; P_.code = 'V20';
    P_.phrase = 'Static lung volumes demonstrate air trapping.';
    if (!ob && R.measured) P_.addon = 'The FEV1/FVC ratio is preserved; air trapping can be an early sign of small-airway involvement.';
  } else if (!T_.measured && trapRVTLC) {
    P_.kind = 'trapNoTLC';
    P_.phrase = 'RV/TLC is elevated, consistent with air trapping; TLC was not entered, so restriction cannot be assessed.';
  } else if (T_.wnl && (v.frc.high || v.frctlc.high) && !trapRVTLC) {
    P_.kind = 'hyper'; P_.phrase = 'FRC is elevated with a normal TLC, consistent with hyperinflation.';
  } else if (T_.wnl && v.rv.low && !v.rvtlc.high && !f.sp.ratio.low && !f.sp.fvc.low) {
    P_.kind = 'lowRV'; P_.lowRV = true;
    P_.phrase = 'RV is below the LLN with a normal TLC and normal spirometry (isolated low RV).';
    P_.addon = 'In the 1987 series, an isolated reduction in RV was a clinically significant finding indicative of pulmonary or chest-wall disease (92% had an associated condition).';
  } else if (T_.wnl) {
    P_.kind = 'normal'; P_.code = 'V1';
    P_.phrase = 'Normal static lung volumes. No restrictive impairment demonstrated.';
  } else {
    P_.kind = 'partial';
    P_.phrase = '';
  }
  // Low RV can coexist with other labels
  if (v.rv.low && !P_.lowRV) P_.lowRVflag = true;
  return P_;
}

/* -------------------------------------------------------------- DLCO pattern */
function dlcoPattern(f) {
  const d = f.dl;
  const P_ = { codes: [], phrase: '', parts: [], kind: 'none', mech: '' };
  const D = d.dlco, ADJ = d.adj;
  if (!d.any) return P_;
  // severity code on the unadjusted value
  if (D.measured) {
    if (D.low) { const c = D.cat === 'sev' ? 'D23' : (D.cat === 'mod' ? 'D22' : 'D21'); P_.codes.push(c); P_.kind = 'low'; }
    else if (D.high) { P_.kind = 'high'; }
    else if (D.bl) { P_.codes.push('D10'); P_.kind = 'bl'; }
    else { P_.codes.push('D1'); P_.kind = 'normal'; }
  } else if (ADJ.measured) {
    P_.kind = ADJ.low ? 'low' : (ADJ.high ? 'high' : (ADJ.bl ? 'bl' : 'normal'));
  }
  const dl = D.measured ? D : ADJ;
  // Hb codes
  if (D.low || (!D.measured && ADJ.low)) {
    if (ADJ.measured && D.measured) { P_.codes.push(ADJ.low ? 'D33' : 'D32'); P_.hb = ADJ.low ? 'partial' : 'full'; }
    else if (!d.hbKnown && !ADJ.measured) { P_.codes.push('D31'); P_.hb = 'none'; }
    else P_.hb = 'noadj';
  }
  if (D.high || (!D.measured && ADJ.high)) {
    if (ADJ.measured && D.measured) { P_.codes.push(ADJ.high ? 'D63' : 'D62'); P_.hb = ADJ.high ? 'unexplained' : 'explained'; }
    else { P_.codes.push('D61'); P_.hb = 'none'; }
  }
  // mechanism (VA / KCO) when DLCO is reduced
  const low = (D.measured ? D.low : ADJ.low);
  const VA = d.va, K = d.kco;
  if (low) {
    if (VA.low && K.high) { P_.codes.push('D41'); P_.mech = 'incomplete'; }
    else if (VA.low && (K.wnl || K.low)) { P_.codes.push('D42'); P_.mech = 'parenchymal'; }
    else if (VA.low && !K.measured) { P_.mech = 'vaOnly'; }
    else if ((VA.wnl || VA.high) && K.low) { P_.mech = 'preservedVA'; }
    else if ((VA.wnl || VA.high) && K.wnl) { P_.mech = 'allNormalExceptDLCO'; }
    else if ((VA.wnl || VA.high) && K.high) { P_.mech = 'discordantK'; }
    else if (!VA.measured && K.measured) { P_.mech = 'kOnly'; }
  } else if (D.wnl && VA.low && K.high) {
    P_.mech = 'incompleteWNL';
  }
  if (d.vatlcLow) P_.codes.push('D51');
  return P_;
}

/* ==========================================================================
   PFT Interpreter engine — part 3: prior comparison + section writers
   Each writer returns { key, title, lines[], codes[], impr[], empty }.
   Wording is objective ("what the interpreter sees"); Annals ATS 2025
   phraseology is used verbatim where a code exists.
   ========================================================================== */

function hyperCtx(f) { const vp = f.vol.pat; return !!(vp.hyper || (f.sp.ratio.low && vp.trap)); }
function newSec(key, title) { return { key: key, title: title, lines: [], codes: [], impr: [], empty: false }; }
function put(sec, s) { const t = sentence(s); if (t) sec.lines.push(t); }
function pctTxt(x) { return has(x) ? Math.round(x) + '% predicted' : ''; }
function uniq(a) { const o = []; a.forEach(x => { if (x && o.indexOf(x) < 0) o.push(x); }); return o; }

/* ------------------------------------------------------------- prior facts */
function priorFacts(st, f) {
  const out = [];
  const cur = st.prior.cur || {};
  const curVal = (id, alt) => { const v = num(cur[id]); return has(v) ? v : alt; };
  const cv = {
    fev1: curVal('fev1', f.sp.fev1L), fvc: curVal('fvc', f.sp.fvcL),
    fev1_pct: curVal('fev1_pct', f.sp.fev1pct), fvc_pct: curVal('fvc_pct', f.sp.fvcpct),
    tlc: curVal('tlc', f.vol.tlcL), dlco: curVal('dlco', f.dl.abs),
    dlco_pct: curVal('dlco_pct', has(f.dl.adjPct) ? f.dl.adjPct : f.dl.pct),
    six: curVal('six', f.six.dist), feno: curVal('feno', f.feno.v),
    fev1_z: f.sp.fev1.z
  };
  const curDate = f.ctx.date;
  (st.prior.list || []).forEach((p, idx) => {
    const pd = parseDate(p.date);
    const yrs = (pd && curDate) ? yearsBetween(pd, curDate) : NaN;
    const o = { idx: idx + 1, date: p.date || '', dateOk: !!pd, years: yrs, metrics: [], notes: [], flags: [] };
    if (has(yrs) && yrs <= 0) o.flags.push({ lvl: 'alert', t: 'Prior study #' + o.idx + ' is dated on or after the current study; check the dates.' });
    const defs = [
      { k: 'fev1', name: 'FEV1', unit: 'L', d: 2, abs: true },
      { k: 'fvc', name: 'FVC', unit: 'L', d: 2, abs: true },
      { k: 'tlc', name: 'TLC', unit: 'L', d: 2, abs: true },
      { k: 'dlco', name: 'DLCO', unit: 'mL/min/mmHg', d: 1, abs: true },
      { k: 'six', name: '6MWD', unit: 'm', d: 0, abs: true },
      { k: 'feno', name: 'FeNO', unit: 'ppb', d: 0, abs: true },
      { k: 'fev1_pct', name: 'FEV1', unit: '% predicted', d: 0, pp: true },
      { k: 'fvc_pct', name: 'FVC', unit: '% predicted', d: 0, pp: true },
      { k: 'dlco_pct', name: 'DLCO', unit: '% predicted', d: 0, pp: true }
    ];
    defs.forEach(df => {
      const a = num(p[df.k]), b = cv[df.k];
      if (!has(a) || !has(b)) return;
      const m = { k: df.k, name: df.name, unit: df.unit, d: df.d, prior: a, cur: b, dAbs: b - a, pp: !!df.pp };
      m.dPct = (!df.pp && a !== 0) ? (b - a) / a * 100 : NaN;
      m.perYear = (has(yrs) && yrs >= 0.25) ? m.dAbs / yrs : NaN;
      m.pctPerYear = (has(m.dPct) && has(yrs) && yrs >= 0.25) ? m.dPct / yrs : NaN;
      o.metrics.push(m);
    });
    // FEV1Q
    const fm = o.metrics.filter(m => m.k === 'fev1')[0];
    if (fm && f.ctx.sex) {
      const den = f.ctx.sex === 'M' ? 0.5 : 0.4;
      fm.q0 = fm.prior / den; fm.q1 = fm.cur / den;
    }
    // Conditional change score (children / young people)
    if (has(num(p.fev1_z)) && has(cv.fev1_z) && has(yrs) && yrs > 0 && has(f.ctx.age) && f.ctx.age < 18) {
      const t1 = Math.max(0, f.ctx.age - yrs);
      const r = 0.642 - 0.04 * yrs + 0.020 * t1;
      if (Math.abs(r) < 1) {
        o.ccs = (cv.fev1_z - r * num(p.fev1_z)) / Math.sqrt(1 - r * r);
        o.ccsR = r;
      }
    }
    out.push(o);
  });
  return out;
}

/* ------------------------------------------------------------ spirometry */
function qualLine(q) {
  if (q === 'A' || q === 'B') return 'Test quality is good and results can be interpreted with confidence (grade ' + q + ')';
  if (q === 'C' || q === 'D' || q === 'E') return 'Test quality is acceptable and usable but technical factors reduce confidence in the interpretation (grade ' + q + ')';
  if (q === 'U') return 'Test quality is usable but technical factors reduce confidence in the interpretation (grade U: usable maneuvers, none fully acceptable)';
  if (q === 'F') return 'Test quality is grade F (no usable maneuvers); these values should generally not be reported or interpreted';
  return '';
}
function measuredLine(f) {
  const s = f.sp, a = [];
  if (has(s.fev1L)) a.push('FEV1 ' + fmt(s.fev1L, 2) + ' L' + (has(s.fev1pct) ? ' (' + Math.round(s.fev1pct) + '% predicted)' : ''));
  else if (has(s.fev1pct)) a.push('FEV1 ' + Math.round(s.fev1pct) + '% predicted');
  if (has(s.fvcL)) a.push('FVC ' + fmt(s.fvcL, 2) + ' L' + (has(s.fvcpct) ? ' (' + Math.round(s.fvcpct) + '% predicted)' : ''));
  else if (has(s.fvcpct)) a.push('FVC ' + Math.round(s.fvcpct) + '% predicted');
  if (has(s.ratioCalc)) a.push('FEV1/FVC ' + fmt(s.ratioCalc, 2));
  return a.length ? 'Measured: ' + a.join('; ') : '';
}

function secSpiro(f) {
  const sec = newSec('spiro', 'SPIROMETRY'), s = f.sp, pat = s.pat;
  if (!s.any && !s.qual) { sec.empty = true; sec.lines.push('No spirometry values entered.'); return sec; }
  put(sec, qualLine(s.qual));
  put(sec, measuredLine(f));
  put(sec, describe('FEV1/FVC', s.ratio));
  put(sec, describe('FEV1', s.fev1));
  put(sec, describe('FVC', s.fvc));
  if (s.fef.measured) put(sec, describe('FEF25-75%', s.fef) + ' (informational; not used to define obstruction or severity)');
  if (f.poorEffort) put(sec, s.effort === 'weak' ? 'Effort: muscle weakness suspected from the maneuver (no sharp PEF)' : 'Effort: submaximal effort or cooperation concern noted');
  if (pat.code) sec.codes.push(pat.code);
  pat.codes.forEach(c => sec.codes.push(c));
  sec.codes = uniq(sec.codes);
  return sec;
}

/* -------------------------------------------------------------------- BD */
function secBD(f) {
  const sec = newSec('bd', 'BRONCHODILATOR RESPONSE'), b = f.bd;
  if (!b.any) { sec.empty = true; sec.lines.push('No bronchodilator data entered.'); return sec; }
  if (b.agent) put(sec, 'Bronchodilator given: ' + b.agent);
  if (b.held === 'y') put(sec, 'Home bronchodilators were withheld before testing');
  else if (b.held === 'n') put(sec, 'Home bronchodilators were not withheld before testing');
  const line = (name, pre, post, pred, dpp) => {
    if (has(pre) && has(post)) {
      const dm = (post - pre) * 1000, dr = pre > 0 ? (post - pre) / pre * 100 : NaN;
      let t = name + ' changed from ' + fmt(pre, 2) + ' L to ' + fmt(post, 2) + ' L (' + fsign(dm, 0) + ' mL';
      if (has(dr)) t += ', ' + fsign(dr, 1) + '% of baseline';
      if (has(dpp)) t += ', ' + fsign(dpp, 1) + '% of predicted';
      put(sec, t + ')');
    } else if (has(dpp)) put(sec, name + ' changed by ' + fsign(dpp, 1) + '% of predicted');
  };
  line('FEV1', b.f1pre, b.f1post, b.f1pred, b.dF);
  line('FVC', b.vpre, b.vpost, b.vpred, b.dV);
  if (b.assessed) {
    const which = b.sigF && b.sigV ? 'FEV1 and FVC' : (b.sigF ? 'FEV1' : 'FVC');
    if (b.sig) {
      sec.codes.push('S62');
      put(sec, 'The increase exceeds 10% of the predicted value in ' + which);
      sec.impr.push('Significant bronchodilator response (increase of more than 10% of the predicted value in ' + which + '; ERS/ATS 2022).' +
        (!f.sp.ratio.low && f.sp.any && f.on.spiro ? ' With a baseline FEV1/FVC that is not below the LLN, this indicates variable airflow limitation.' : ''));
    } else {
      sec.codes.push('S61');
      put(sec, 'The change in FEV1 and FVC does not exceed 10% of the predicted value' +
        ((!b.assessedF || !b.assessedV) ? ' (only ' + (b.assessedF ? 'FEV1' : 'FVC') + ' could be assessed)' : ''));
      sec.impr.push('No significant bronchodilator response by ERS/ATS 2022 criteria' + (f.sp.ratio.low ? '; bronchodilator therapy may still be useful.' : '.'));
    }
    if (b.drop) put(sec, 'FEV1 or FVC decreased by more than 10% of predicted after bronchodilator');
  }
  if (b.postRatio.measured) {
    put(sec, describe('Post-bronchodilator FEV1/FVC', b.postRatio));
    if (b.postRatio.low) sec.impr.push('Persistent airflow obstruction after bronchodilator (post-BD FEV1/FVC below the LLN).');
    else if (f.sp.ratio.low) sec.impr.push('Post-bronchodilator FEV1/FVC is no longer below the LLN (reversible airflow obstruction).');
  }
  if (b.postFev1.measured) put(sec, describe('Post-bronchodilator FEV1', b.postFev1));
  return sec;
}

/* -------------------------------------------------------- upper-airway indices */
function loopInfo(key) { return LOOPS.filter(l => l[0] === key)[0] || null; }
function secFvl(f) {
  const sec = newSec('fvl', 'FLOW-VOLUME LOOP'), v = f.fvl;
  if (!v.any) { sec.empty = true; sec.lines.push('No flow-volume loop or flow-index values entered.'); return sec; }
  const L = v.loop, info = loopInfo(L), flat = (L === 'expflat' || L === 'inspflat' || L === 'bothflat');
  if (info) {
    put(sec, 'Loop shape: ' + info[3]);
    if (flat) put(sec, v.repro ? 'The flattening is reproducible on repeat maneuvers' : 'The flattening is not reproducible on repeat maneuvers');
    if (flat && v.repro) sec.codes.push(L === 'expflat' ? 'S51' : (L === 'inspflat' ? 'S52' : 'S53'));
  }
  put(sec, describe('PEF', v.pef));
  if (has(v.pefL)) put(sec, 'PEF ' + fmt(v.pefL, 0) + ' L/min');
  if (has(v.fevPef)) put(sec, 'FEV1/PEF is ' + fmt(v.fevPef, 1) + ' mL/L/min' + (v.fevPef > 8 ? ' (above 8)' : ' (not above 8)'));
  else if (v.fevPefHi === true) put(sec, 'FEV1/PEF is above 8 mL/L/min');
  else if (v.fevPefHi === false) put(sec, 'FEV1/PEF is not above 8 mL/L/min');
  put(sec, describe('FIF50%', v.fif50c));
  if (has(v.fef50)) put(sec, 'FEF50% is ' + fmt(v.fef50, 2) + ' L/s');
  if (has(v.fif50)) put(sec, 'FIF50% is ' + fmt(v.fif50, 2) + ' L/s');
  if (v.fifCat) put(sec, 'FIF50/FEF50 is ' + (has(v.fifFef) ? fmt(v.fifFef, 2) : ({ lt: 'below 1', eq: 'about 1', gt: 'above 1' })[v.fifCat]));
  loopLines(f).forEach(l => sec.impr.push(l));
  sec.codes = uniq(sec.codes);
  return sec;
}
/* Meaning of the loop and the flow indices (goes to the INTERPRETATION). */
function loopLines(f) {
  const v = f.fvl, L = v.loop, R = f.sp.ratio, T = f.vol.tlc, out = [];
  const flat = (L === 'expflat' || L === 'inspflat' || L === 'bothflat');
  if (L === 'concave') out.push(R.low ? 'The concave expiratory limb of the flow-volume loop is concordant with airflow obstruction.' : 'Concavity of the expiratory limb of the loop may reflect small-airway dysfunction or reduced elastic recoil.');
  else if (L === 'sevobs') out.push('The flow-volume loop shape (low early peak, marked scooping, long low-flow tail) is typical of severe airflow obstruction with air trapping.');
  else if (L === 'convex') out.push('The small, steep loop with relatively preserved flows accompanies restrictive processes' + (T.low ? ', concordant with the reduced TLC.' : (T.measured && T.wnl ? ', but the shape is not specific and the TLC is normal.' : '; the shape is not specific, and lung volumes are needed to confirm restriction.')));
  else if (L === 'effort') out.push('The blunted or late peak with an irregular curve suggests submaximal effort; FEV1 and FVC may be underestimated.');
  else if (L === 'weak') out.push('The low rounded peak flow with a reduced inspiratory limb is a shape seen with respiratory-muscle weakness.');
  else if (L === 'slow') out.push('The slow rise to the peak suggests a hesitant start; FEV1 and PEF may be underestimated unless the back-extrapolated volume was acceptable (under 5% of FVC or 0.100 L).');
  else if (L === 'cough') out.push('The early cough artifact can lower the FEV1 falsely.');
  else if (L === 'early') out.push('Early termination of exhalation makes FVC and FEV1/FVC unreliable.');
  else if (L === 'saw') out.push('Saw-tooth oscillations may reflect mechanical instability of the airway wall (floppy tissue, tremor, neuromuscular disease or sleep apnea).');
  else if (L === 'unilat') out.push('Biphasic expiratory flow can be seen with unilateral main-bronchus obstruction or after single-lung transplant.');
  else if (flat) {
    if (v.repro) out.push(L === 'bothflat' ? 'Flow-volume loop suggests fixed central or upper-airway obstruction.'
      : (L === 'inspflat' ? 'Flow-volume loop suggests extrathoracic upper-airway obstruction.' : 'Flow-volume loop suggests intrathoracic central or upper-airway obstruction.'));
    else out.push('Flattening of the loop is present but not reproducible; submaximal effort cannot be excluded and does not support upper-airway obstruction.');
  }
  if (v.fevPefHi === true) out.push('FEV1/PEF above 8 mL/L/min suggests central or upper-airway obstruction (poor initial effort can also raise this ratio); inspiratory and expiratory flow-volume loops are advised to look for it.');
  if (v.fifCat) {
    const reduced = v.pef.low || v.fif50c.low || flat;
    if (reduced) out.push('With reduced flows, FIF50/FEF50 ' + (v.fifCat === 'lt' ? 'below 1 fits a variable extrathoracic pattern' : (v.fifCat === 'gt' ? 'above 1 fits a variable intrathoracic pattern' : 'of about 1 fits a fixed obstruction pattern')) + ' (ERS/ATS 2022 Table 6).');
  }
  return out;
}

/* ------------------------------------------------------------- lung volumes */
function secVol(f) {
  const sec = newSec('vol', 'LUNG VOLUMES'), v = f.vol, vp = v.pat;
  if (!v.any) { sec.empty = true; sec.lines.push('No lung-volume values entered.'); return sec; }
  const mth = { pleth: 'body plethysmography', n2: 'nitrogen washout', he: 'helium dilution', sb: 'single-breath dilution' }[v.method];
  if (mth) put(sec, 'Lung volumes were measured by ' + mth);
  if (v.qc === 'limited') put(sec, 'Technical factors reduce confidence in the lung-volume measurements');
  const vals = [];
  if (has(v.tlcL)) vals.push('TLC ' + fmt(v.tlcL, 2) + ' L');
  if (has(v.rvL)) vals.push('RV ' + fmt(v.rvL, 2) + ' L');
  if (has(v.rvtlcCalc)) vals.push('RV/TLC ' + fmt(v.rvtlcCalc, 0) + '%');
  if (has(v.frcL)) vals.push('FRC ' + fmt(v.frcL, 2) + ' L');
  if (has(v.svcL)) vals.push('SVC ' + fmt(v.svcL, 2) + ' L');
  if (vals.length) put(sec, 'Measured: ' + vals.join('; '));
  put(sec, describe('TLC', v.tlc));
  put(sec, describe('RV', v.rv));
  put(sec, describe('RV/TLC', v.rvtlc));
  put(sec, describe('FRC', v.frc));
  put(sec, describe('FRC/TLC', v.frctlc));
  put(sec, describe('SVC', v.svc));
  put(sec, describe('ERV', v.erv));
  put(sec, describe('IC', v.ic));
  if (vp.code) sec.codes.push(vp.code);
  if (has(f.sp.fvcL) && has(v.svcL)) {
    const dd = (v.svcL - f.sp.fvcL) * 1000;
    if (dd > 100) { put(sec, 'SVC exceeds FVC by ' + fmt(dd, 0) + ' mL'); sec.impr.push('SVC exceeds FVC by ' + fmt(dd, 0) + ' mL, which suggests airway collapse or air trapping during the forced maneuver.'); }
  }
  if (v.erv.low && f.ctx.obese && !v.rvtlc.high) sec.impr.push('Low ERV with a preserved RV/TLC is the pattern typically seen with obesity (BMI ' + fmt(f.ctx.bmi, 1) + ').');
  return sec;
}

/* -------------------------------------------------------------------- DLCO */
function secDlco(f) {
  const sec = newSec('dlco', 'DLCO'), d = f.dl, pat = d.pat;
  if (!d.any) { sec.empty = true; sec.lines.push('No diffusing-capacity values entered.'); return sec; }
  if (d.qc === 'limited') put(sec, 'Technical factors reduce confidence in the diffusing-capacity measurement');
  const vals = [];
  if (has(d.abs)) vals.push('DLCO ' + fmt(d.abs, 1) + ' mL/min/mmHg' + (has(d.pct) ? ' (' + Math.round(d.pct) + '% predicted, not Hb-adjusted)' : ''));
  else if (has(d.pct)) vals.push('DLCO ' + Math.round(d.pct) + '% predicted (not Hb-adjusted)');
  if (has(d.vaL)) vals.push('VA ' + fmt(d.vaL, 2) + ' L');
  if (has(d.vatlc)) vals.push('VA/TLC ' + fmt(d.vatlc, 2));
  if (vals.length) put(sec, 'Measured: ' + vals.join('; '));
  {
    const Dp = d.dlco.measured ? d.dlco : d.adj;
    if (Dp.measured) {
      const sw = Dp.cat === 'sev' ? 'severely' : (Dp.cat === 'mod' ? 'moderately' : 'mildly');
      const lab = d.dlco.measured ? (d.adj.measured ? 'DLCO not Hb-adjusted' : 'DLCO') : 'Hb-adjusted DLCO';
      const zt = Dp.zTxt ? ' (' + lab + ' ' + Dp.zTxt + ')' : (d.dlco.measured && d.adj.measured ? ' (not Hb-adjusted)' : '');
      let ph;
      if (Dp.cat === 'wnl') ph = 'Diffusing capacity is within normal limits';
      else if (Dp.cat === 'bl') ph = 'Diffusing capacity is borderline low';
      else if (Dp.low) ph = 'Diffusing capacity is ' + sw + ' reduced';
      else if (Dp.high) ph = 'Diffusing capacity is above the ULN';
      put(sec, ph + zt);
      if (d.dlco.measured && d.adj.measured) put(sec, describe('Hb-adjusted DLCO', d.adj));
    }
  }
  if (has(d.hb)) {
    put(sec, 'Hemoglobin is ' + fmt(d.hb, 1) + ' g/dL' + (d.anemic ? ' (below the usual lower limit)' : ''));
    if (has(d.adjPct) && !d.adj.measured) put(sec, 'Hb-adjusted DLCO is approximately ' + Math.round(d.adjPct) + '% predicted (estimated with the ERS/ATS 2017 equation, reference Hb ' + d.hbRef + ' g/dL)');
  } else if (d.hbcat) {
    put(sec, 'Hemoglobin is ' + ({ low: 'low (anemia)', nl: 'normal', high: 'high' })[d.hbcat] + ' per the report');
  }
  if (has(d.cohb)) put(sec, 'Carboxyhemoglobin is ' + fmt(d.cohb, 1) + '%');
  else if (d.cohbcat === 'hi') put(sec, 'Carboxyhemoglobin is 2% or higher');
  put(sec, describe('VA', d.va));
  put(sec, describe('KCO (DLCO/VA)', d.kco));
  if (has(d.vatlc)) put(sec, 'VA/TLC is ' + fmt(d.vatlc, 2) + (d.vatlc < 0.85 ? ' (below 0.85)' : ''));
  else if (d.vatlcSel === 'low') put(sec, 'VA/TLC is below 0.85');
  pat.codes.forEach(c => sec.codes.push(c));
  sec.codes = uniq(sec.codes);
  return sec;
}

/* ----------------------------------------------------------- airway resistance */
function secRaw(f) {
  const sec = newSec('raw', 'AIRWAY RESISTANCE'), r = f.raw;
  if (!r.any) { sec.empty = true; sec.lines.push('No airway-resistance values entered.'); return sec; }
  put(sec, describe('Raw', r.raw)); put(sec, describe('sRaw', r.sraw)); put(sec, describe('sGaw', r.sgaw));
  if (r.bd === 'imp') put(sec, 'Resistance improved after bronchodilator'); else if (r.bd === 'none') put(sec, 'No meaningful change in resistance after bronchodilator');
  if (r.raw.high || r.sraw.high || r.sgaw.low) sec.impr.push('Increased airway resistance (or reduced conductance), indicating airway narrowing' + (f.sp.ratio.low ? ', concordant with the airflow obstruction on spirometry.' : ' with no airflow obstruction on spirometry (Raw can add information when spirometry is non-specific or normal).'));
  else if (r.raw.wnl || r.sraw.wnl || r.sgaw.wnl) sec.impr.push('Airway resistance is within normal limits.');
  return sec;
}

/* ------------------------------------------------------------- oscillometry */
function secOsc(f) {
  const sec = newSec('osc', 'OSCILLOMETRY'), o = f.osc;
  if (!o.any) { sec.empty = true; sec.lines.push('No oscillometry values entered.'); return sec; }
  put(sec, describe('R5', o.r5)); put(sec, describe('R5-R20', o.r520)); put(sec, describe('X5 (reactance)', o.x5));
  put(sec, describe('AX', o.ax)); put(sec, describe('Fres', o.fres));
  if (o.bdr === 'pos') put(sec, 'Oscillometric bronchodilator response is significant per laboratory criteria');
  else if (o.bdr === 'neg') put(sec, 'Oscillometric bronchodilator response is not significant per laboratory criteria');
  const abn = o.r5.high || o.r520.high || o.x5.low || o.ax.high || o.fres.high;
  if (abn) sec.impr.push('Abnormal respiratory-system mechanics on oscillometry' + ((o.r520.high || o.x5.low || o.ax.high) ? ', with features that point to peripheral (small-airway) involvement' : '') + (!f.sp.ratio.low && f.sp.any ? '; oscillometry can detect obstruction when FEV1/FVC is normal.' : '.'));
  else sec.impr.push('Oscillometry is within normal limits.');
  return sec;
}

/* ----------------------------------------------------- respiratory muscle tests */
function secMip(f) {
  const sec = newSec('mip', 'RESPIRATORY MUSCLE STRENGTH'), m = f.mp;
  if (!m.any) { sec.empty = true; sec.lines.push('No respiratory-muscle values entered.'); return sec; }
  const one = (name, val, st_, thr, sexNeeded) => {
    if (st_ === 'nm') return;
    const vs = has(val) ? fmt(val, 0) + ' cmH2O' : '';
    if (st_ === 'low') put(sec, name + ' is reduced' + (vs ? ' (' + vs + (has(thr) ? '; expected ≥ ' + thr + ' cmH2O' : '') + ')' : ''));
    else if (st_ === 'wnl') put(sec, name + ' is within normal limits' + (vs ? ' (' + vs + ')' : ''));
    else put(sec, name + ' is ' + vs + (sexNeeded ? '; sex is needed to compare with the reference threshold' : ''));
  };
  one('MIP', m.mipV, m.mip, m.thr.mip, true);
  one('MEP', m.mepV, m.mep, m.thr.mep, true);
  one('SNIP', m.snipV, m.snip, m.thr.snip, false);
  if (m.effort === 'poor') put(sec, 'Submaximal effort was suspected during the pressure maneuvers');
  if (m.p01 === 'low') put(sec, 'P0.1 is low'); else if (m.p01 === 'high') put(sec, 'P0.1 is elevated'); else if (m.p01 === 'wnl') put(sec, 'P0.1 is within normal limits');
  if (has(m.cpf)) put(sec, 'Cough peak flow is ' + fmt(m.cpf, 0) + ' L/min');
  else if (m.cpfCat === 'vlow') put(sec, 'Cough peak flow is 160 L/min or less');
  else if (m.cpfCat === 'low') put(sec, 'Cough peak flow is below 270 L/min');
  else if (m.cpfCat === 'ok') put(sec, 'Cough peak flow is 270 L/min or more');
  if (has(m.mvv)) {
    let t = 'MVV is ' + fmt(m.mvv, 0) + ' L/min';
    if (has(f.sp.fev1L)) t += '; estimated from FEV1 (35–40 × FEV1) the expected range is ' + fmt(f.sp.fev1L * 35, 0) + '–' + fmt(f.sp.fev1L * 40, 0) + ' L/min';
    put(sec, t);
  }
  const lowI = m.mip === 'low' || m.snip === 'low', lowE = m.mep === 'low';
  if (lowI && lowE) sec.impr.push('Reduced inspiratory and expiratory muscle strength' + (hyperCtx(f) ? '; hyperinflation can lower MIP and MEP and may contribute.' : '.'));
  else if (lowI) sec.impr.push('Reduced inspiratory muscle strength' + (hyperCtx(f) ? ' (hyperinflation can lower MIP and may contribute).' : '.'));
  else if (lowE) sec.impr.push('Reduced expiratory muscle strength' + (hyperCtx(f) ? ' (hyperinflation can lower MEP and may contribute).' : '.'));
  else if (m.mip === 'wnl' || m.mep === 'wnl' || m.snip === 'wnl') sec.impr.push('Respiratory muscle strength is within normal limits.');
  if (has(m.cpf) ? m.cpf <= 160 : m.cpfCat === 'vlow') sec.impr.push('Cough peak flow is in the ineffective-cough range (160 L/min or less).');
  else if (has(m.cpf) ? m.cpf < 270 : m.cpfCat === 'low') sec.impr.push('Cough peak flow is below 270 L/min, indicating reduced cough effectiveness in neuromuscular disease.');
  if (m.p01 === 'low') sec.impr.push('Low P0.1 suggests blunted respiratory drive.'); else if (m.p01 === 'high') sec.impr.push('Elevated P0.1 indicates increased respiratory drive.');
  return sec;
}

/* ----------------------------------------------------------------- postural */
function secPost(f) {
  const sec = newSec('post', 'UPRIGHT VS. SUPINE'), p = f.post;
  if (!p.any) { sec.empty = true; sec.lines.push('No postural values entered.'); return sec; }
  const nm = (p.which === 'svc') ? 'SVC' : 'FVC';
  if (has(p.drop)) {
    put(sec, nm + ' fell from ' + fmt(p.up, 2) + ' L upright to ' + fmt(p.sup, 2) + ' L supine, a ' + fmt(p.drop, 1) + '% fall');
    if (p.drop >= 30) sec.impr.push('Marked postural fall in vital capacity (' + fmt(p.drop, 0) + '%), suggestive of bilateral diaphragm weakness.');
    else if (p.drop >= 20) sec.impr.push('Abnormal postural fall in vital capacity (' + fmt(p.drop, 0) + '%), suggestive of diaphragm weakness.');
    else if (p.drop >= 10) sec.impr.push('Borderline postural fall in vital capacity (' + fmt(p.drop, 0) + '%), above the expected change; may reflect mild or unilateral diaphragm weakness.');
    else if (p.drop >= 0) sec.impr.push('No significant postural fall in vital capacity (under 10%).');
    else put(sec, 'Supine ' + nm + ' is higher than upright; check the entries');
  } else if (p.fallSel) {
    const band = { ge30: '30% or more', b20_30: '20–29%', b10_20: '10–19%', lt10: 'under 10%' }[p.band];
    if (band) put(sec, 'The supine fall in ' + nm + ' is ' + band);
    if (p.band === 'ge30') sec.impr.push('Marked postural fall in vital capacity (30% or more), suggestive of bilateral diaphragm weakness.');
    else if (p.band === 'b20_30') sec.impr.push('Abnormal postural fall in vital capacity (20–29%), suggestive of diaphragm weakness.');
    else if (p.band === 'b10_20') sec.impr.push('Borderline postural fall in vital capacity (10–19%); may reflect mild or unilateral diaphragm weakness.');
    else if (p.band === 'lt10') sec.impr.push('No significant postural fall in vital capacity.');
  }
  if (!has(p.dSpO2) && !has(p.dPaO2) && p.orthSel === 'yes') { put(sec, 'Orthodeoxia is reported'); sec.impr.push('Orthodeoxia reported (oxygen saturation falls by 5 points or more on standing).'); }
  else if (!has(p.dSpO2) && !has(p.dPaO2) && p.orthSel === 'no') put(sec, 'No orthodeoxia on standing');
  if (has(p.dSpO2)) {
    put(sec, 'SpO2 was ' + fmt(p.spo2s, 0) + '% supine and ' + fmt(p.spo2u, 0) + '% upright (change ' + fsign(-p.dSpO2, 0) + ' points on standing)');
    if (p.dSpO2 >= 5) sec.impr.push('Orthodeoxia by SpO2 (fall of at least 5 points from supine to upright).');
  }
  if (has(p.dPaO2)) {
    put(sec, 'PaO2 was ' + fmt(p.pao2s, 0) + ' mmHg supine and ' + fmt(p.pao2u, 0) + ' mmHg upright (change ' + fsign(-p.dPaO2, 0) + ' mmHg on standing)');
    if (p.dPaO2 > 4) sec.impr.push('Orthodeoxia by PaO2 (fall of more than 4 mmHg from supine to upright).');
  }
  if (p.orthop) put(sec, 'Orthopnea is reported'); if (p.platyp) put(sec, 'Platypnea is reported');
  return sec;
}

/* --------------------------------------------------------------------- FeNO */
function fenoBand(f) {
  const v = f.feno.v, child = f.feno.child;
  const lo = child ? 20 : 25, hi = child ? 35 : 50;
  if (!has(v)) return { lo: lo, hi: hi, cat: ({ low: 'low', int: 'intermediate', high: 'high' })[f.feno.bandSel] || 'intermediate' };
  return { lo: lo, hi: hi, cat: v < lo ? 'low' : (v > hi ? 'high' : 'intermediate') };
}
function secFeno(f) {
  const sec = newSec('feno', 'FeNO'), n = f.feno;
  if (!n.any) { sec.empty = true; sec.lines.push('No FeNO value entered.'); return sec; }
  const b = fenoBand(f);
  put(sec, 'FeNO is ' + (has(n.v) ? fmt(n.v, 0) + ' ppb, which is ' : '') + b.cat + ' (' + (n.child ? 'children under 12 years' : 'adult') + ' cut-points: low < ' + b.lo + ', high > ' + b.hi + ' ppb)');
  if (n.ics === 'y') put(sec, 'The patient is taking inhaled corticosteroids');
  if (f.ctx.smoke === 'current') put(sec, 'The patient is a current smoker');
  if (n.confound) put(sec, 'A possible confounder was recorded (recent exercise, spirometry, nitrate-rich food or viral infection)');
  if (!has(f.ctx.age)) put(sec, 'Age was not entered; adult cut-points were used');
  const base = 'FeNO is ' + b.cat + (has(n.v) ? ' (' + fmt(n.v, 0) + ' ppb)' : '');
  if (b.cat === 'high') sec.impr.push(base + ', consistent with type-2 / eosinophilic airway inflammation; a response to corticosteroids is more likely.');
  else if (b.cat === 'low') sec.impr.push(base + '; eosinophilic airway inflammation and a response to corticosteroids are less likely in a symptomatic patient.');
  else sec.impr.push(base + '; an intermediate value should be interpreted cautiously with the clinical context.');
  if (n.ics === 'y') sec.impr.push('FeNO may be suppressed by corticosteroid therapy.');
  return sec;
}

/* ----------------------------------------------------------- bronchoprovocation */
function mchCategory(q) {
  if (q.mchNeg) return { cat: 'negative' };
  if (!has(q.mchVal)) return q.mchCat ? { cat: ({ neg: 'negative', bl: 'borderline', mild: 'mild', mod: 'moderate', marked: 'marked' })[q.mchCat] } : null;

      const dd = m.d;

const T = {};

T.basics = { title: 'Reading a PFT: the logic', kicker: 'Start here', blocks: [
  { p: 'A pulmonary function report is read in a fixed order, and each step narrows what the next one means. The order below is the one ERS/ATS 2022 recommends and the one this app follows.' },
  { h: 'The order of reasoning', ol: [
    'FEV1/FVC against the lower limit of normal (LLN). A ratio below the LLN is airflow obstruction, and nothing else defines it.',
    'If the ratio is low: the FEV1 z-score sets the severity. The FVC then points to other pathology (a low FVC with obstruction means air trapping, coexisting restriction, or a short exhalation).',
    'Total lung capacity (TLC): low = restriction, normal, or high = hyperinflation. Only the TLC can confirm restriction.',
    'RV and RV/TLC: high with obstruction = air trapping and hyperinflation. Low TLC with a high RV/TLC = complex restriction (think weakness or chest wall).',
    'DLCO, graded by its z-score and always read with VA and KCO, with the hemoglobin (and carboxyhemoglobin) in mind.',
    'Then the extras: bronchodilator response, loop shape, muscle strength, FeNO, challenge testing, exercise tests, blood gas.',
    'Compare with prior studies, then put pattern, severity, gas transfer and the clinical question together in the interpretation.'] },
  { h: 'z-scores and the lower limit of normal', p: 'A z-score says how many standard deviations a result sits from the average of healthy people of the same age, sex and height. Zero is average. The LLN is −1.645 (the 5th percentile) and the ULN is +1.645. Because the spread of healthy values changes with age and height, a z-score is fair across the whole age range, where a fixed percentage of predicted is not.', fig: 'zscale' },
  { h: 'Severity bands (ERS/ATS 2022)', table: { head: ['z-score', 'Label'], rows: [['−1.645 to −2.5', 'Mild'], ['−2.51 to −4.0', 'Moderate'], ['below −4.0', 'Severe'], ['above +1.645', 'Above the upper limit of normal']] },
    note: 'The same bands are used for FEV1, FVC, TLC, DLCO and the other indices. Severity here describes the physiological impairment, not how the patient feels or functions.' },
  { h: 'Why not 80% of predicted, or a fixed ratio of 0.70?', p: 'Fixed cut-offs are easy to remember but misclassify. FEV1/FVC falls with age, so a fixed 0.70 over-calls obstruction in older adults and under-calls it in the young. A fixed 80% of predicted does the same with height and age. The LLN moves with the person. This app uses the LLN, as ERS/ATS 2022 recommends.' },
  { h: 'Borderline values', p: '1 in 20 healthy people falls below the LLN on any single measure by definition. A value just above the LLN can still be meaningful, for example in a patient with symptoms, a falling trend, or a family history. The Details step has a setting for how close to the LLN a value must be to be called borderline.' },
  { h: 'Limits to keep in mind', ul: [
    'A z-score is only as good as the equation behind it and the quality of the maneuver behind that.',
    'PFTs describe physiology. They rarely make a diagnosis alone; the interpretation has to be put beside the history, imaging and exam.',
    'With many measurements on one report, a healthy person has a high chance of one value falling below the LLN by chance. A single borderline-low number in an otherwise normal study is rarely meaningful.'] },
  { terms: true },
  { src: ['Stanojevic S, et al. ERS/ATS technical standard on interpretive strategies for routine lung function tests. Eur Respir J 2022;60:2101499.', 'Annals ATS 2025 (standardized phraseology and codes).'] }
] };

T.spiro = { title: 'Spirometry', kicker: 'FEV1 · FVC · FEV1/FVC', blocks: [
  { h: 'What it is for', ul: [
    'Detects and grades airflow obstruction (asthma, COPD, bronchiectasis, cystic fibrosis, bronchiolitis).',
    'Shows a pattern that suggests restriction (low FVC, preserved ratio), which the lung volumes then confirm or refute.',
    'The standard way to follow disease: FEV1 and FVC over time in obstructive disease, ILD, cystic fibrosis, transplant.',
    'First-line test for cough, dyspnea, wheeze, and before many procedures.'] },
  { h: 'What good technique looks like (ATS/ERS 2019)', ul: [
    'Maximal inhalation, a fast, forceful blast out, and continued exhalation to a plateau or at least 6 seconds in adults.',
    'A sharp start: back-extrapolated volume under 5% of the FVC or 0.100 L, whichever is greater.',
    'No cough in the first second, no early termination, no leak, no obstruction of the mouthpiece.',
    'At least 3 acceptable maneuvers; the two largest FEV1 values and the two largest FVC values within 0.150 L of each other.'] },
  { h: 'Quality grades', table: { head: ['Grade', 'What it means'], rows: [
      ['A', '3 or more acceptable maneuvers, repeatable within 0.150 L'],
      ['B', '2 acceptable, repeatable within 0.150 L'],
      ['C', '2 or more acceptable, repeatable within 0.200 L'],
      ['D', '2 or more acceptable, repeatable within 0.250 L'],
      ['E', 'Only 1 acceptable, or 2 or more that do not repeat within 0.250 L'],
      ['U', 'No acceptable maneuver but at least one usable'],
      ['F', 'No acceptable or usable maneuver']] },
    note: 'Grades describe the maneuvers, not the patient. Grades A and B support interpretation with confidence; C to E carry a technical caveat; F should generally not be reported.' },
  { h: 'How to read it', ol: [
    'Look at the FEV1/FVC z-score. Below the LLN = obstruction.',
    'If low, grade the obstruction by the FEV1 z-score (mild −1.65 to −2.5; moderate −2.51 to −4.0; severe below −4.0).',
    'Check the FVC. Low FVC with a low ratio: air trapping, coexisting restriction, or an incomplete exhalation. Lung volumes separate them.',
    'If the ratio is normal and the FVC is low: the pattern suggests restriction, but only the TLC confirms it. Many patients with this pattern turn out to have a normal TLC.',
    'Look at the loop. A scooped (concave) limb can precede a low ratio. A flat-topped or truncated limb should raise the question of upper-airway obstruction.',
    'FEF25–75% is not used to define obstruction or its severity (ERS/ATS 2022).'] },
  { h: 'Patterns at a glance', table: { head: ['FEV1/FVC', 'FEV1', 'FVC', 'Reading'], rows: [
      ['Low', 'Low', 'Normal', 'Obstruction, graded by the FEV1 z-score'],
      ['Low', 'Low', 'Low', 'Obstruction with a low FVC: air trapping, coexisting restriction or short exhalation; get lung volumes'],
      ['Low', 'Normal', 'High', 'Possible obstruction in a dysanaptic (large airways relative to lung size) normal variant'],
      ['Normal', 'Low', 'Low', 'Suggests restriction; confirm with TLC. If effort was poor, say so'],
      ['Normal', 'Normal', 'Normal', 'No obstruction; look at the loop for early concavity'],
      ['Normal', 'Low or normal', 'Low or normal', 'Isolated low FEV1 or FVC with a normal ratio: recheck effort and technique before interpreting']] } },
  { h: 'Limitations', ul: [
    'Effort dependent. A submaximal effort lowers every value and can mimic restriction or weakness.',
    'A normal spirometry does not exclude asthma, early emphysema, small-airway disease or mild interstitial lung disease.',
    'Not informative about gas exchange; add DLCO.',
    'Values depend on the reference set. A different set shifts the z-scores and can change the label, especially in older, taller, shorter and non-European-ancestry patients.',
    'A single study reports one day; day-to-day variation of FEV1 in a stable person is about 5%.'] },
  { terms: true },
  { src: ['Graham BL, et al. Standardization of spirometry 2019 update. ATS/ERS. Am J Respir Crit Care Med 2019;200:e70.', 'Stanojevic S, et al. Eur Respir J 2022 (interpretive strategies).'] }
] };

T.loops = { title: 'Flow–volume loops', kicker: 'Shape, peak flow, FIF50/FEF50', blocks: [
  { h: 'What it is for', ul: [
    'Quick check of effort and technique: a good loop has a sharp peak early and a smooth, complete exhalation.',
    'Shows the type of obstruction: scooped limbs for intrathoracic airflow obstruction; plateaus for central or upper-airway obstruction.',
    'Looks for patterns that the numbers can miss: dynamic (variable) upper-airway obstruction, vocal-cord dysfunction, tracheomalacia, weakness.'] },
  { h: 'How to read the axes', p: 'The vertical axis is flow; the horizontal axis is volume. Expiration plots above the line (read left to right, from TLC to RV), inspiration below. The peak expiratory flow comes early; the descending limb is roughly straight in a healthy adult.', fig: 'loopLegend' },
  { h: 'A systematic look', ol: [
    'Is the loop complete and reproducible? Overlay at least three efforts. Flattening only counts if it reproduces.',
    'Is the start sharp, with a peak flow in the first part of the exhalation? A late, rounded peak means submaximal effort or weakness.',
    'Is the expiratory limb straight, scooped (concave) or flat-topped?',
    'Is the inspiratory limb a full, smooth half-circle? A flat inspiratory limb is easy to miss on a report that prints only the expiratory part.',
    'Do the flows agree with the numbers? Compare the shape with the FEV1/FVC, the PEF, FEV1/PEF and FIF50/FEF50.'] },
  { h: 'Upper-airway obstruction: what the loop should show', table: { head: ['Lesion', 'Expiratory limb', 'Inspiratory limb', 'Indices'], rows: [
      ['Variable extrathoracic (vocal-cord dysfunction or paralysis, goiter, extrathoracic mass)', 'Preserved', 'Flattened or truncated', 'FIF50/FEF50 below 1'],
      ['Variable intrathoracic (tracheomalacia, intrathoracic tracheal tumor)', 'Early peak then plateau', 'Preserved', 'FIF50/FEF50 above 1'],
      ['Fixed (tracheal stenosis, fixed lesion)', 'Flattened', 'Flattened (box-like loop)', 'FIF50/FEF50 about 1; FEV1/PEF above 8']] },
    note: 'Confirm with laryngoscopy during symptoms, dynamic airway CT or bronchoscopy. Poor effort can imitate each of these, so look for reproducibility.' },
  { h: 'Typical loops: the gallery', fig: 'loops' },
  { h: 'Limitations', ul: [
    'The shape supports, but does not replace, the numbers and the clinical picture.',
    'Many shapes are not specific: a small tall loop can be restriction, effort or weakness; a flat limb can be a lesion or poor effort.',
    'Needs a full inspiratory maneuver to read the inspiratory limb. If inspiration was not maximal, do not interpret it.',

  { terms: true },
  { src: ['Stanojevic S, et al. ERS/ATS 2022 (Table of flow–volume loop patterns and the FIF50/FEF50 and FEV1/PEF indices).', 'Annals ATS 2025 (S10, S51–S53 phrases).'] }
] };

T.bd = { title: 'Bronchodilator response', kicker: 'Reversibility', blocks: [
  { h: 'What it is for', ul: [
    'Shows how much of the obstruction reverses with an inhaled short-acting bronchodilator.',
    'Documents whether obstruction persists after treatment, which matters for how the disease is classified and followed.',
    'A significant response supports asthma-like physiology; a lack of response does not exclude asthma.'] },
  { h: 'How the test is done', p: 'Baseline spirometry, a short-acting bronchodilator (for example albuterol 400 µg by metered-dose inhaler and spacer), a 10 to 15 minute wait, then repeat spirometry. Bronchodilators should be withheld beforehand according to the lab’s protocol; if they were not, the measured response is smaller.' },
  { h: 'How to read it', ol: [
    'Compute the change in FEV1 and in FVC, each as a percentage of its predicted value: (post − pre) ÷ predicted × 100.',
    'A change above 10% of the predicted value in FEV1 and/or FVC is a significant response (ERS/ATS 2022). This replaced the older 12% and 200 mL of baseline rule.',
    'Look at the post-bronchodilator ratio. If it is still below the LLN, obstruction persists.',
    'Look at the post-bronchodilator loop. A flat or scooped limb that does not change is information too.'] },
  { h: 'Limitations', ul: [
    'The response varies from visit to visit. A negative test on one day does not make airway lability impossible.',
    'Big changes in the FVC with little change in the FEV1 reflect gas trapping that released, not necessarily large-airway reversibility.',
    'Someone with normal baseline spirometry and a normal ratio can still have asthma; a bronchodilator response is not required for the diagnosis.'] },
  { terms: true },
  { src: ['Stanojevic S, et al. Eur Respir J 2022;60:2101499 (bronchodilator responsiveness: > 10% of predicted).'] }
] };

T.vol = { title: 'Lung volumes', kicker: 'TLC · RV · RV/TLC · FRC', blocks: [
  { h: 'What it is for', ul: [
    'Confirms or excludes restriction (only the TLC can).',
    'Measures hyperinflation and air trapping in obstructive disease.',
    'Separates mixed disorders, and clarifies a low FVC when the ratio is normal or low.',
    'Raises the question of weakness or chest-wall disease when the TLC is low and the RV/TLC is high.'] },
  { h: 'Methods', table: { head: ['Method', 'What it measures', 'Strength', 'Weakness'], rows: [
      ['Body plethysmography', 'All gas in the thorax, including trapped gas', 'Accurate in obstruction', 'Panting technique; claustrophobia; effort'],
      ['Nitrogen washout / helium dilution', 'Gas that mixes with the inspired gas', 'Easy, can be done at the bedside', 'Under-reads TLC and RV when there is trapped or poorly ventilated gas (obstruction, bullae)'],
      ['Single-breath (VA from DLCO)', 'Alveolar volume during the breath-hold', 'No extra test', 'Least accurate; under-reads in obstruction'],
      ['Imaging (CT volumes)', 'Anatomical lung volume', 'Independent of effort', 'Not a physiological test; inspiratory CT lung volume is not the same as TLC']] } },
  { h: 'How to read it', ol: [
    'TLC below the LLN = restriction. A low FVC with a normal TLC is not restriction.',
    'TLC above the ULN = hyperinflation (with obstruction) or large lungs (normal variant) if the ratio is normal.',
    'RV/TLC above the ULN = air trapping.',
    'Low TLC and a high RV/TLC = complex restriction: ask about respiratory muscle weakness and chest-wall disease; measure MIP/MEP and the supine fall in vital capacity.',
    'Obstruction with a low TLC = mixed disorder (a low TLC with a low ratio, confirmed by plethysmography).'] },
  { h: 'Patterns', table: { head: ['TLC', 'RV/TLC', 'Pattern'], rows: [
      ['Low', 'Normal', 'Simple restriction (ILD, pleural disease, obesity, resection)'],
      ['Low', 'High', 'Complex restriction (weakness, chest wall, advanced fibrosis with trapping)'],
      ['Normal', 'High', 'Air trapping (obstructive or small-airway disease)'],
      ['High', 'High', 'Hyperinflation with air trapping (emphysema, severe asthma)'],
      ['Normal', 'Normal', 'Normal volumes']] } },
  { h: 'Limitations', ul: [
    'Dilution methods can under-read TLC in obstruction and so overcall restriction. Check which method was used.',
    'Obesity lowers FRC and ERV; the TLC is often only mildly reduced or normal.',
    'The GLI-2021 volume equations cover ages 5 to 80 and European ancestry; use other groups with caution.',
    'An RV/TLC a little over the ULN can reflect a small TLC (a ratio, not a volume).'] },
  { terms: true },
  { src: ['Stanojevic S, et al. ERS/ATS 2022 (Figure: interpreting lung volumes).', 'Hall GL, et al. GLI-2021 lung volumes. Eur Respir J 2021;57:2000289.'] }
] };

T.dlco = { title: 'DLCO and gas transfer', kicker: 'DLCO · VA · KCO · hemoglobin', blocks: [
  { h: 'What it is for', ul: [
    'Measures the lung’s ability to transfer gas from alveolus to red cell.',
    'Separates airway-predominant from parenchymal or pulmonary-vascular disease.',
    'A sensitive early marker in ILD, emphysema, pulmonary hypertension and drug toxicity (amiodarone, bleomycin, checkpoint inhibitors); used for monitoring.',
    'Helps explain hypoxemia, and a low TLC with a normal or high KCO points to an extraparenchymal cause.'] },
  { h: 'How the test is done', p: 'The patient exhales fully, inhales a gas mix containing a trace of carbon monoxide to full inspiration, holds the breath for about 10 seconds, then exhales. The CO taken up, per unit of driving pressure, is the DLCO. The dilution of the tracer gas gives the alveolar volume (VA). KCO is DLCO divided by VA.' },
  { h: 'How to read it', ol: [
    'Grade the DLCO by its z-score with the same bands as other measures.',
    'Check hemoglobin. Anemia lowers the DLCO; the hemoglobin-adjusted DLCO shows whether the lung contributes beyond that. Polycythemia raises it.',
    'Check carboxyhemoglobin. A smoker with a high COHb will read low.',
    'Look at the VA. A low VA with a preserved or high KCO suggests incomplete expansion (weakness, chest wall, poor effort, resection).',
    'A low DLCO with preserved VA and a low KCO suggests alveolar–capillary or vascular disease.'] },
  { h: 'Patterns', table: { head: ['DLCO', 'VA', 'KCO', 'Think of'], rows: [
      ['Low', 'Normal', 'Low', 'Emphysema, ILD, pulmonary vascular disease, anemia (check Hb)'],
      ['Low', 'Low', 'Low or normal', 'Loss of gas-transfer surface: ILD, resection, extensive emphysema'],
      ['Low', 'Low', 'High', 'Incomplete expansion: weakness, chest wall, pleural disease, poor effort'],
      ['Normal', 'Any', 'Any', 'Normal. A normal DLCO can mask emphysema plus fibrosis, which pull in opposite directions'],
      ['High', 'Any', 'Any', 'Polycythemia, pulmonary hemorrhage, left-to-right shunt, obesity, asthma, exercise or supine posture before the test']] } },
  { h: 'Hemoglobin adjustment', p: 'DLCO is corrected to a standard hemoglobin (ERS/ATS 2017): adjusted DLCO = measured DLCO × (10.22 + Hb) ÷ (1.7 × Hb) for adult men and children over 15; × (9.38 + Hb) ÷ (1.7 × Hb) for women and children under 15. Hb in g/dL. Each percentage point of carboxyhemoglobin lowers the DLCO by roughly 1%, and many labs correct for it.' },
  { h: 'Limitations', ul: [
    'KCO does not scale linearly with VA, so a normal KCO with a low VA does not mean normal gas transfer.',
    'Needs a good effort: inspired volume at least 85% of the largest vital capacity, a 9 to 11 second breath-hold, and repeat values within about 2 units.',
    'Altitude, recent exercise, supine posture, smoking and the time of day all shift the result.',
    'GLI-2017 DLCO equations are for European ancestry; a hemoglobin-based reference is needed for many clinical questions.'] },
  { terms: true },
  { src: ['Graham BL, et al. ERS/ATS standardization of the single-breath DLCO 2017. Eur Respir J 2017;49:1600016.', 'Stanojevic S, et al. GLI-2017 TLCO. Eur Respir J 2017;50:1700010.'] }
] };

T.raw = { title: 'Airway resistance', kicker: 'Raw · sRaw · sGaw', blocks: [
  { h: 'What it is for', ul: [
    'Measures resistance to airflow during tidal breathing in the body box, without a forced maneuver.',
    'Helps when forced maneuvers are hard or misleading (central airway obstruction, vocal-cord dysfunction, poor cooperation).',
    'A response to bronchodilator can be shown in resistance when the FEV1 does not change.'] },
  { h: 'How to read it', ol: [
    'Raw (resistance) is high, and sGaw (specific conductance) is low, in airflow obstruction.',
    'sRaw is Raw multiplied by the thoracic gas volume at which it was measured; it adjusts for lung size.',
    'Look at the resistance loop: a shallow slope and a widely open loop suggest obstruction.',
    'Interpret against the lab’s reference values or the z-scores they report.'] },
  { h: 'Limitations', ul: [
    'Panting frequency matters; very rapid panting can distort the measurement.',
    'Upper-airway resistance contributes; nasal breathing or a closed glottis changes the result.',
    'Reference equations are less standardized than for spirometry.'] },
  { terms: true },
  { src: ['Criée CP, et al. Body plethysmography: its principles and clinical use. Respir Med 2011;105:959.', 'ERS/ATS 2022 (interpretive strategies).'] }
] };

T.osc = { title: 'Oscillometry', kicker: 'R5 · R5–R20 · X5 · AX · Fres', blocks: [
  { h: 'What it is for', ul: [
    'Measures the mechanical impedance of the respiratory system during quiet breathing, with small pressure oscillations at the mouth.',
    'No forced maneuver, so it works in young children, the elderly and in patients who cannot do spirometry well.',
    'Sensitive to small-airway disease and to bronchodilator and bronchoprovocation responses.'] },
  { h: 'How to read it', ol: [
    'R5 (resistance at 5 Hz) reflects total airway resistance; R20 reflects the large airways. R5–R20 is the frequency dependence of resistance and is thought to reflect small-airway disease.',
    'X5 (reactance at 5 Hz) becomes more negative when peripheral lung is stiff or obstructed. AX (area of reactance) and Fres (resonant frequency) rise in the same conditions.',
    'A bronchodilator response is judged by the lab’s criterion (often a fall in R5 or a rise in X5 beyond the within-subject variability).'] },
  { h: 'Limitations', ul: [
    'Devices differ, and reference equations differ between devices. This app takes the lab’s categories rather than recalculating them.',
    'Upper-airway shunt (cheek and tongue movement) lowers the apparent resistance. Hold the cheeks and avoid swallowing.',
    'Oscillometry has not replaced spirometry for diagnosing obstruction or grading severity.'] },
  { terms: true },
  { src: ['King GG, et al. Technical standards for respiratory oscillometry. Eur Respir J 2020;55:1900753.'] }
] };

T.mip = { title: 'Respiratory muscle strength', kicker: 'MIP · MEP · SNIP · cough peak flow', blocks: [
  { h: 'What it is for', ul: [
    'Detects weakness of the inspiratory muscles (diaphragm) and expiratory muscles when the lung volumes show a low TLC with a high RV/TLC, or when there is unexplained dyspnea, hypercapnia or orthopnea.',
    'Used in ALS, myasthenia gravis, Guillain–Barré, muscular dystrophies, diaphragm paralysis, spinal cord injury and critical illness.',
    'Cough peak flow estimates whether a patient can clear secretions.'] },
  { h: 'How to read it', ol: [
    'MIP is measured at residual volume; MEP at total lung capacity; SNIP is a nasal sniff from FRC. All are reported as magnitudes in cmH2O.',
    'This app flags a low MIP below 75 (men) or 50 (women) cmH2O, a low MEP below 100 or 80, and a low SNIP below 40, as screening thresholds from Kaminsky 2018. A lab’s own reference values take priority.',
    'A normal MIP largely excludes clinically important inspiratory weakness. A low value is only convincing when the effort was maximal and reproducible.',
    'Low MIP and MEP together, with a low TLC and a high RV/TLC, indicate generalized weakness.',
    'Cough peak flow: 270 L/min or more is adequate; below 270 reduced; 160 or less an ineffective cough.'] },
  { h: 'Limitations', ul: [
    'Effort and learning dependent. A low value with a poor effort is not weakness.',
    'Hyperinflation lowers the MIP because the diaphragm starts from a shortened length.',
    'Cheek and lip leaks and blocked nostrils (for SNIP) cause false-low readings.',
    'MIP does not distinguish central from peripheral causes of weakness.'] },
  { terms: true },
  { src: ['Laveneziana P, et al. ERS statement on respiratory muscle testing at rest and during exercise. Eur Respir J 2019;53:1801214.', 'Kaminsky DA, et al. ATS Pulmonary function testing interpretation, 2018.'] }
] };

T.post = { title: 'Upright vs. supine testing', kicker: 'Supine fall in vital capacity · orthodeoxia', blocks: [
  { h: 'What it is for', ul: [
    'Supine vital capacity looks for diaphragm weakness in a patient with orthopnea or unexplained restriction.',
    'Upright versus supine oxygenation looks for orthodeoxia in platypnea–orthodeoxia (PFO or other shunts, hepatopulmonary syndrome, basal lung disease).'] },
  { h: 'How to read it', ol: [
    'Measure the FVC (or SVC) sitting, wait a few minutes supine, and repeat.',
    'A fall of 10% is the usual upper limit of normal; 20% or more suggests diaphragm weakness, and 30% or more bilateral diaphragm weakness.',
    'For oxygenation, a fall in SpO2 of 5 points or more, or in PaO2 of more than 4 mmHg, from supine to upright is orthodeoxia.'] },
  { h: 'Limitations', ul: [
    'Obesity, ascites, and pregnancy lower the supine value too.',
    'A single measurement can be affected by effort; repeat when the numbers are borderline.',
    'Platypnea–orthodeoxia can be intermittent; a normal study on one day does not exclude it.'] },
  { terms: true },
  { src: ['Kaminsky DA, et al. ATS Pulmonary function testing interpretation, 2018.', 'Laveneziana P, et al. Eur Respir J 2019.'] }
] };

T.bronch = { title: 'Bronchoprovocation testing', kicker: 'Methacholine · mannitol · exercise/EVH', blocks: [
  { h: 'What it is for', ul: [
    'Tests for airway hyperresponsiveness when asthma is suspected but spirometry is normal.',
    'A negative methacholine test in a patient with current symptoms and no controller therapy makes current asthma unlikely.',
    'Indirect challenges (mannitol, exercise, eucapnic voluntary hyperventilation) are more specific for the inflammation of asthma and are used for exercise-induced bronchoconstriction.'] },
  { h: 'How to read it', ol: [
    'Methacholine: PC20 or PD20 is the dose that lowers FEV1 by 20%. Above 16 mg/mL is negative, 4 to 16 borderline, below 4 positive.',
    'Mannitol: positive with a fall of 15% from baseline at a cumulative dose of 635 mg or less, or an incremental fall of 10% or more between consecutive doses.',
    'Exercise or EVH: positive with a fall in FEV1 of 10% or more at two consecutive time points after the challenge.',
    'Report the reversal with a bronchodilator when the FEV1 fell by 20% or more (or by the lab’s stopping criterion).'] },
  { h: 'Limitations', ul: [

    'Inhaled corticosteroids and recent bronchodilators lower the response and cause false-negatives. Follow the lab’s hold times.',
    'A low baseline FEV1 (roughly under 60 to 70% of predicted) is a relative contraindication; follow the lab’s criteria.',
    'Not a screening test in healthy people.'] },
  { terms: true },

/* Build a state from a test list and a list of 'module.field=value' specs. */
function buildExample(P, ex) {
  const st = P.defaultState();
  Object.keys(st.tests).forEach(k => { st.tests[k] = false; });
  ex.tests.forEach(t => { st.tests[t] = true; });
  ex.specs.forEach(s => {
    const eq = s.indexOf('='), path = s.slice(0, eq), val = s.slice(eq + 1);
    const dot = path.indexOf('.'), mod = path.slice(0, dot), id = path.slice(dot + 1);
    if (mod === 'prior') {
      const m = /^(\d+)\.(.+)$/.exec(id);
      if (m) { while (st.prior.list.length < +m[1]) st.prior.list.push(P.blankPrior()); st.prior.list[+m[1] - 1][m[2]] = val; }
      else st.prior.cur[id] = val;
      return;
    }
    const field = P.SCHEMA[mod].groups.reduce((a, g) => a.concat(g.fields), []).filter(f => f.id === id)[0];
    if (!field) throw new Error('unknown example field ' + path);
    if (field.type === 'param') st[mod][id] = /^z/.test(val) ? { c: 'nm', z: val.slice(1) } : { c: val, z: '' };
    else if (field.type === 'chk') st[mod][id] = (val === '1' || val === 'true');
    else if (field.type === 'multi') st[mod][id] = val ? val.split(',') : [];
    else st[mod][id] = val;
  });
  return P.normalizeState(st);
}

/* ------------------------------------------------------------------ the chart */
function trendSvg(t, f) {
  const pts = t.pts, n = pts.length;
  const W = 640, H = 276, L = 48, RM = 22, T = 24, B = 38, pw = W - L - RM, ph = H - T - B;
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'tr-svg', role: 'img', tabindex: '0',
    'aria-label': '6-minute walk distance over time: ' + pts.map(p => Math.round(p.dist) + ' m on ' + fmtDay(p.ds)).join('; ') + '. Use the left and right arrow keys to step through the walks; a table view is below.' });
  const TX = (x, y, txt, cls, anchor) => { const e = sv('text', { x: x, y: y, class: 'tr-t' + (cls ? ' ' + cls : ''), 'text-anchor': anchor || 'start' }); e.textContent = txt; svg.appendChild(e); return e; };
  let t0 = Math.min.apply(null, pts.map(p => p.date.getTime())), t1 = Math.max.apply(null, pts.map(p => p.date.getTime()));
  const spanDays = (t1 - t0) / 86400000;
  if (t1 === t0) { t0 -= 20 * 86400000; t1 += 20 * 86400000; } else { const pad = (t1 - t0) * 0.04; t0 -= pad; t1 += pad; }
  let lo = Math.min.apply(null, pts.map(p => p.dist)), hi = Math.max.apply(null, pts.map(p => p.dist));
  const lln = f.six.lln;
  const llnOn = typeof lln === 'number' && isFinite(lln) && lln > lo - 160 && lln < hi + 160;
  if (llnOn) { lo = Math.min(lo, lln); hi = Math.max(hi, lln); }
  const prev = n >= 2 ? pts[n - 2] : null;
  if (prev) { lo = Math.min(lo, prev.dist - MID6); hi = Math.max(hi, prev.dist + MID6); }
  const span = Math.max(hi - lo, 60);
  const step = span <= 100 ? 20 : (span <= 260 ? 50 : (span <= 600 ? 100 : 200));
  const y0 = Math.max(0, Math.floor((lo - span * 0.14) / step) * step), y1 = Math.ceil((hi + span * 0.18) / step) * step;
  const sx = (ms) => L + (ms - t0) / (t1 - t0) * pw, sy = (v) => T + (1 - (v - y0) / (y1 - y0)) * ph;
  // grid and y ticks
  for (let v = y0; v <= y1 + 1e-6; v += step) {
    svg.appendChild(sv('line', { x1: L, x2: W - RM, y1: sy(v).toFixed(1), y2: sy(v).toFixed(1), class: 'tr-grid' }));
    TX(L - 8, sy(v) + 4, String(v), 'tick', 'end');
  }
  TX(4, 12, 'meters', 'axis', 'start');
  // x ticks
  const long = spanDays > 400, nt = Math.max(2, Math.min(6, Math.floor(pw / 112)));
  for (let k = 0; k < nt; k++) {
    const ms = t0 + (t1 - t0) * k / (nt - 1), x = sx(ms);
    svg.appendChild(sv('line', { x1: x.toFixed(1), x2: x.toFixed(1), y1: H - B, y2: H - B + 4, class: 'tr-axis' }));
    TX(x, H - B + 18, fmtMon(ms, long), 'tick', k === 0 ? 'start' : (k === nt - 1 ? 'end' : 'middle'));
  }
  svg.appendChild(sv('line', { x1: L, x2: W - RM, y1: H - B, y2: H - B, class: 'tr-axis' }));
  // minimal-important-difference band around the previous walk
  if (prev) svg.appendChild(sv('rect', { x: sx(prev.date.getTime()).toFixed(1), y: sy(prev.dist + MID6).toFixed(1), width: (W - RM - sx(prev.date.getTime())).toFixed(1), height: (sy(prev.dist - MID6) - sy(prev.dist + MID6)).toFixed(1), class: 'tr-band' }));
  // LLN
  if (llnOn) { svg.appendChild(sv('line', { x1: L, x2: W - RM, y1: sy(lln).toFixed(1), y2: sy(lln).toFixed(1), class: 'tr-lln' })); TX(W - RM - 2, sy(lln) - 5, 'LLN ' + Math.round(lln) + ' m', 'muted', 'end'); }
  // line
  if (n >= 2) svg.appendChild(sv('polyline', { points: pts.map(p => sx(p.date.getTime()).toFixed(1) + ',' + sy(p.dist).toFixed(1)).join(' '), class: 'tr-line', fill: 'none' }));
  // markers
  const hl = sv('circle', { r: '10', class: 'tr-hl', cx: '0', cy: '0' }); hl.style.display = 'none';
  const cross = sv('line', { class: 'tr-cross', y1: T, y2: H - B }); cross.style.display = 'none';
  svg.appendChild(cross);
  pts.forEach((p, i) => {

async function saveFile(name, text, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('downloads');
      if (d && typeof d.save === 'function') {
        try { await d.save({ filename: name, data: text }); toast('Saved ' + name); return; }
        catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) { toast(e.code === 'declined' ? 'Save cancelled' : 'Try again in a moment'); return; } }
      }
    }
  } catch (e) { /* fall through */ }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
    const a = h('a', { href: url, download: name, style: 'display:none' }); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Downloading ' + name); return;
  } catch (e) { /* fall through */ }
  showFallback(text);
}
function csvCell(v) { const s = String(v === null || v === undefined ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function reviewLogCsv() {
  const rows = [['case_id', 'label', 'saved_at', 'tests', 'codes', 'review_status', 'sections_to_change', 'note', 'reviewed_at', 'first_interpretation_line']];
  bankLoad().forEach(c => { const r = c.review || {}; rows.push([c.id, c.label, c.savedAt, (c.tests || []).join(' '), (c.codes || []).join(' '), r.status || '', (r.sections || []).join(' '), r.note || '', r.at || '', c.summary || '']); });
  return rows.map(r => r.map(csvCell).join(',')).join('\n');
}
function importBank(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return { ok: false, msg: 'That is not valid JSON.' }; }
  const arr = Array.isArray(o) ? o : (o && Array.isArray(o.cases) ? o.cases : null);
  if (!arr) return { ok: false, msg: 'No cases found in that file.' };
  const b = bankLoad(), have = {}; b.forEach(c => { have[c.id] = 1; });
  let added = 0, skipped = 0;
  arr.forEach(c => {
    if (!c || typeof c !== 'object' || !c.state || typeof c.state !== 'object') { skipped++; return; }
    const id = typeof c.id === 'string' && c.id ? c.id.slice(0, 40) : rnd();
    if (have[id]) { skipped++; return; }
    const st = P.normalizeState(c.state), res = P.interpret(st);
    const rv = c.review && typeof c.review === 'object' ? c.review : {};
    const rec = { id: id, savedAt: typeof c.savedAt === 'string' ? c.savedAt.slice(0, 40) : new Date().toISOString(), label: String(c.label || '').slice(0, 60), state: st, sig: signature(res),
      codes: uniq(res.sections.reduce((a, s) => a.concat(s.codes || []), [])), summary: res.impression[0] || '', impression: res.impression.slice(0, 12), tests: Object.keys(st.tests).filter(k => st.tests[k]),
      headsup: res.headsup.filter(x => x.lvl !== 'note').map(x => ({ id: x.id, lvl: x.lvl, title: x.title })).slice(0, 20),
      review: { status: (rv.status === 'agree' || rv.status === 'edit') ? rv.status : '', sections: Array.isArray(rv.sections) ? rv.sections.filter(k => REVIEW_PARTS.some(p => p[0] === k)) : [], note: String(rv.note || '').slice(0, 600), at: String(rv.at || '').slice(0, 40) } };
    b.push(rec); have[id] = 1; added++;
  });
  if (b.length > BANK_CAP) b.length = BANK_CAP;
  if (o && o.feedback && typeof o.feedback === 'object' && !Array.isArray(o.feedback)) {
    const all = fbLoad();
    Object.keys(o.feedback).forEach(id => {
      const e = o.feedback[id]; if (!e || typeof e !== 'object' || !e.by || typeof e.by !== 'object') return;
      const t = all[id] || (all[id] = { title: String(e.title || id).slice(0, 120), by: {} });
      Object.keys(e.by).slice(0, 300).forEach(k => { if ((e.by[k] === 'u' || e.by[k] === 'n') && !(k in t.by)) t.by[k] = e.by[k]; });

  return { ok: true, msg: 'Added ' + plural(added, 'case') + (skipped ? ', skipped ' + skipped + ' (duplicates or unreadable)' : '') + '.' };
}

function bankStats() {

  const parts = {}, byCode = {};
  rev.forEach(c => {
    (c.codes || []).forEach(k => { const e = byCode[k] || (byCode[k] = { n: 0, edit: 0 }); e.n++; if (c.review.status === 'edit') e.edit++; });
    if (c.review.status === 'edit') (c.review.sections || []).forEach(k => { parts[k] = (parts[k] || 0) + 1; });

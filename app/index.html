  }
  if (has(d.hb)) {
    put(sec, 'Hemoglobin is ' + fmt(d.hb, 1) + ' g/dL' + (d.anemic ? ' (below the usual lower limit)' : ''));
    if (has(d.adjPct) && !d.hasAdj) put(sec, 'Hemoglobin-adjusted DLCO would be approximately ' + Math.round(d.adjPct) + '% predicted (estimate from the ERS/ATS 2017 equation with reference Hb ' + d.hbRef + ' g/dL; the laboratory adjustment is preferred)');
  } else if (d.hbcat) put(sec, 'Hemoglobin is ' + ({ low: 'low (anemia)', nl: 'normal', high: 'high' })[d.hbcat] + ' per the report');
  if (has(d.cohb)) put(sec, 'Carboxyhemoglobin is ' + fmt(d.cohb, 1) + '%');
  else if (d.cohbcat === 'hi') put(sec, 'Carboxyhemoglobin is 2% or higher');
  put(sec, metricLine(f, 'diffusion.va', d.va, 'VA'));
  put(sec, metricLine(f, 'diffusion.kco', d.kco, 'KCO'));
  if (has(d.vatlc)) put(sec, 'VA/TLC is ' + fmt(d.vatlc, 2) + (d.vatlc < 0.85 ? ' (below the 0.85 convention)' : ''));
  else if (d.vatlcSel === 'low') put(sec, 'VA/TLC is below 0.85');
  pat.codes.forEach(c => sec.codes.push(c));
  sec.codes = uniq(sec.codes);
  return sec;
}

/* ----------------------------------------------------------- airway resistance */
function secRaw(f) {
  const sec = newSec('raw', 'AIRWAY RESISTANCE'), r = f.raw;
  if (!r.any) { sec.empty = true; sec.lines.push('No airway-resistance values entered.'); return sec; }
  put(sec, describe('Raw', r.raw)); put(sec, describe('sRaw', r.sraw)); put(sec, describe('sGaw', r.sgaw));
  if (r.bd === 'imp') put(sec, ptext('resistance.response', 'standard')); else if (r.bd === 'none') put(sec, 'No meaningful change in resistance after bronchodilator');
  if (r.raw.high || r.sraw.high || r.sgaw.low) sec.impr.push('Airway resistance is increased (or specific conductance reduced), indicating altered airway mechanics' + (f.sp.ratio.low ? ', concordant with the airflow obstruction on spirometry.' : (f.sp.any ? ' without spirometric obstruction; resistance can add information when spirometry is nonspecific or normal, but is not an independent diagnostic criterion.' : '.')));
  else if (r.raw.wnl || r.sraw.wnl || r.sgaw.wnl) sec.impr.push('Airway resistance is within reference limits, which does not exclude airway disease.');
  return sec;
}

/* ------------------------------------------------------------- oscillometry */
function secOsc(f) {
  const sec = newSec('osc', 'OSCILLOMETRY'), o = f.osc;
  if (!o.any) { sec.empty = true; sec.lines.push('No oscillometry values entered.'); return sec; }
  put(sec, describe('R5', o.r5)); put(sec, describe('R5-R20', o.r520)); put(sec, describe('X5 (reactance)', o.x5).replace('below the LLN', 'more negative than its lower reference limit'));
  put(sec, describe('AX', o.ax)); put(sec, describe('Fres', o.fres));
  if (o.bdr === 'pos') put(sec, ptext('oscillometry.bd_response', 'standard'));
  else if (o.bdr === 'neg') put(sec, 'Oscillometric bronchodilator response is not significant per laboratory criteria');
  const abn = o.r5.high || o.r520.high || o.x5.low || o.ax.high || o.fres.high;
  if (abn) sec.impr.push('Oscillometry shows abnormal respiratory-system mechanics' + ((o.r520.high || o.x5.low || o.ax.high) ? ', with increased frequency dependence or reactance abnormality that is compatible with heterogeneous airway mechanics (not a direct measure of peripheral-airway resistance)' : '') + (!f.sp.ratio.low && f.sp.any ? '; oscillometry can detect altered mechanics when FEV1/FVC is normal.' : '.'));
  else sec.impr.push('Oscillometry is within the configured reference limits.');
  return sec;
}

/* ----------------------------------------------------- respiratory muscle tests */
function secMip(f) {
  const sec = newSec('mip', 'RESPIRATORY MUSCLE STRENGTH'), m = f.mp;
  if (!m.any) { sec.empty = true; sec.lines.push('No respiratory-muscle values entered.'); return sec; }
  if (m.effort === 'poor') put(sec, ptext('quality.pressure_limited', 'standard'));
  if (m.effort === 'bulbar') put(sec, ptext('muscle.bulbar_limit', 'standard'));
  if (m.effort === 'inv') put(sec, 'The pressure measurements are not interpretable');
  const one = (name, val, st_, thr, src, sexNeeded) => {
    if (st_ === 'not_measured') return;
    const vs = has(val) ? fmt(val, 0) + ' cmH2O' : '';
    const ref = has(thr) ? (src === 'lab' ? 'lab lower limit ' + fmt(thr, 0) + ' cmH2O' : 'screening threshold ' + fmt(thr, 0) + ' cmH2O') : '';
    if (st_ === 'invalid') put(sec, name + ' is not interpretable' + (vs ? ' (' + vs + ')' : ''));
    else if (st_ === 'low') put(sec, name + ' magnitude is below its reference limit' + (vs || ref ? ' (' + [vs, ref].filter(Boolean).join('; ') + ')' : ''));
    else if (st_ === 'normal') put(sec, name + ' magnitude is within its reference range' + (vs || ref ? ' (' + [vs, ref].filter(Boolean).join('; ') + ')' : ''));
    else put(sec, name + ' is ' + vs + (sexNeeded ? '; sex (or the lab lower limit) is needed to compare it with a reference' : ''));
  };
  one('MIP', m.mipV, m.mip, m.thr.mip, m.thrSrc.mip, true);
  one('MEP', m.mepV, m.mep, m.thr.mep, m.thrSrc.mep, true);
  one('SNIP', m.snipV, m.snip, m.thr.snip, m.thrSrc.snip, false);
  if ((m.mip === 'low' || m.mep === 'low' || m.snip === 'low' || m.mip === 'normal' || m.mep === 'normal') && [m.thrSrc.mip, m.thrSrc.mep].some(x => x === 'screen') && (has(m.mipV) || has(m.mepV)) && !(m.mipC.measured && m.mepC.measured))
    put(sec, 'Screening thresholds are the commonly cited values (MIP 75/50 and MEP 100/80 cmH2O for men/women, SNIP 40 cmH2O), not a validated lower limit of normal; the laboratory reference takes precedence when available');
  if (m.p01 === 'low') put(sec, 'P0.1 is low'); else if (m.p01 === 'high') put(sec, 'P0.1 is elevated'); else if (m.p01 === 'wnl') put(sec, 'P0.1 is within normal limits');
  if (has(m.cpf)) put(sec, 'Peak cough flow is ' + fmt(m.cpf, 0) + ' L/min');
  else if (m.cpfCat === 'vlow') put(sec, 'Peak cough flow is 160 L/min or less');
  else if (m.cpfCat === 'low') put(sec, 'Peak cough flow is below 270 L/min');
  else if (m.cpfCat === 'ok') put(sec, 'Peak cough flow is 270 L/min or more');
  if (has(m.mvv)) {
    let t = 'MVV is ' + fmt(m.mvv, 0) + ' L/min';
    if (has(f.sp.fev1L)) t += '; the range estimated from FEV1 (35–40 × FEV1) is ' + fmt(f.sp.fev1L * 35, 0) + '–' + fmt(f.sp.fev1L * 40, 0) + ' L/min';
    put(sec, t);
  }
  const lowI = m.mip === 'low' || m.snip === 'low', lowE = m.mep === 'low';
  const hy = hyperCtx(f) ? ' Hyperinflation can lower volitional pressures and may contribute.' : '';
  const pair = (id) => ptext(id, 'concise').replace(/\.$/, '') + '; ' + ptext(id, 'expanded').charAt(0).toLowerCase() + ptext(id, 'expanded').slice(1);
  if (m.mip === 'low' && m.mep === 'low') sec.impr.push(pair('muscle.pattern.both_low') + hy);
  else if (m.mip === 'low' && m.mep === 'normal') sec.impr.push(pair('muscle.pattern.mip_low_mep_preserved') + hy);
  else if (m.mep === 'low' && m.mip === 'normal') sec.impr.push(pair('muscle.pattern.mep_low_mip_preserved') + hy);
  else if (lowI || lowE) sec.impr.push((lowI ? 'Inspiratory' : 'Expiratory') + ' pressure magnitude is below its reference limit; this may reflect muscle weakness, submaximal effort or technique.' + hy);
  else if (m.mip === 'normal' && m.mep === 'normal') sec.impr.push(ptext('muscle.pattern.both_normal', 'expanded'));
  else if (m.mip === 'normal' || m.mep === 'normal' || m.snip === 'normal') sec.impr.push('The measured respiratory pressure is within its reference range on this effort-dependent test.');
  if (has(m.cpf) ? m.cpf <= 160 : m.cpfCat === 'vlow') sec.impr.push('Peak cough flow is 160 L/min or less, the range associated with ineffective cough in neuromuscular disease guidance (a disease-specific threshold, not a healthy-adult reference limit).');
  else if (has(m.cpf) ? m.cpf < 270 : m.cpfCat === 'low') sec.impr.push('Peak cough flow is below 270 L/min, the threshold used for reduced airway-clearance reserve in neuromuscular disease guidance (not a healthy-adult reference limit).');
  if (m.p01 === 'low') sec.impr.push('Low P0.1 suggests blunted respiratory drive.'); else if (m.p01 === 'high') sec.impr.push('Elevated P0.1 indicates increased respiratory drive.');
  return sec;
}

/* ----------------------------------------------------------------- postural */
function secPost(f) {
  const sec = newSec('post', 'UPRIGHT VS. SUPINE'), p = f.post, V = f.vals;
  if (!p.any) { sec.empty = true; sec.lines.push('No postural values entered.'); return sec; }
  const nm = (p.which === 'svc') ? 'SVC' : 'FVC';
  if (p.limited) put(sec, ptext('muscle.supine_limited', 'standard'));
  if (p.dropComputable) {
    put(sec, nm + ' fell from ' + fmt(p.up, 2) + ' L upright to ' + fmt(p.sup, 2) + ' L supine, a ' + fmt(p.drop, 1) + '% decrease');
    if (p.drop >= 30) sec.impr.push('The postural fall in vital capacity (' + fmt(p.drop, 0) + '%) is well above the 15% screening clue (ERS 2019) and in the range cited for bilateral diaphragm weakness (30% or more); this supports possible diaphragmatic dysfunction but does not prove it.');
    else if (p.drop >= 20) sec.impr.push('The postural fall in vital capacity (' + fmt(p.drop, 0) + '%) exceeds the 15% screening clue (ERS 2019) and the 20% threshold cited for diaphragm weakness; this supports possible diaphragmatic dysfunction but does not prove it.');
    else if (p.drop >= 15) sec.impr.push('The postural fall in vital capacity (' + fmt(p.drop, 0) + '%) reaches the 15% screening clue discussed in the ERS 2019 statement; baseline mechanics and the clinical question determine its importance.');
    else if (p.drop >= 10) sec.impr.push('The postural fall in vital capacity (' + fmt(p.drop, 0) + '%) is above the change expected in health (under 10%) but below the 15% screening clue.');
    else sec.impr.push('No excessive postural fall in vital capacity (' + fmt(p.drop, 0) + '%; under 10% is expected in health).');
  } else if (p.supineHigher) {
    put(sec, nm + ' was ' + fmt(p.up, 2) + ' L upright and ' + fmt(p.sup, 2) + ' L supine (higher supine, an increase of ' + fmt(-p.drop, 1) + '%)');
    sec.impr.push('Vital capacity increased when supine; this is not a postural decrease and should prompt a check of the maneuvers and the entries.');
  } else if (p.fallSel && !p.limited) {
    const band = { ge30: '30% or more', b20_30: '20–29%', b10_20: '10–19%', lt10: 'under 10%' }[p.band];
    if (band) put(sec, 'The supine fall in ' + nm + ' is ' + band);
    if (p.band === 'ge30') sec.impr.push('A postural fall in vital capacity of 30% or more is in the range cited for bilateral diaphragm weakness; this supports possible diaphragmatic dysfunction but does not prove it.');
    else if (p.band === 'b20_30') sec.impr.push('A postural fall in vital capacity of 20–29% exceeds the 15% screening clue (ERS 2019) and the 20% threshold cited for diaphragm weakness; this supports possible diaphragmatic dysfunction but does not prove it.');
    else if (p.band === 'b10_20') sec.impr.push('A postural fall in vital capacity of 10–19% is above the change expected in health; whether it is excessive depends on the exact value (15% is the screening clue) and the clinical question.');
    else if (p.band === 'lt10') sec.impr.push('No excessive postural fall in vital capacity.');
  }
  if (!has(p.dSpO2) && !has(p.dPaO2) && p.orthSel === 'yes') { put(sec, 'Orthodeoxia is reported'); sec.impr.push('Orthodeoxia reported (oxygen saturation falls by 5 points or more on standing).'); }
  else if (!has(p.dSpO2) && !has(p.dPaO2) && p.orthSel === 'no') put(sec, 'No orthodeoxia on standing');
  if (has(p.dSpO2)) {
    put(sec, 'SpO2 was ' + fmt(p.spo2s, 0) + '% supine and ' + fmt(p.spo2u, 0) + '% upright (change ' + fsign(-p.dSpO2, 0) + ' points on standing)');
    if (p.dSpO2 >= 5) sec.impr.push('Orthodeoxia by SpO2 (fall of at least 5 points from supine to upright).');
  }
  if (has(p.dPaO2)) {
    put(sec, 'PaO2 was ' + fmt(p.pao2s, 0) + ' mmHg supine and ' + fmt(p.pao2u, 0) + ' mmHg upright (change ' + fsign(-p.dPaO2, 0) + ' mmHg on standing)');
    if (p.dPaO2 > 4) sec.impr.push('Orthodeoxia by PaO2 (fall of more than 4 mmHg from supine to upright).');
  }
  if (p.orthop) put(sec, 'Orthopnea is reported'); if (p.platyp) put(sec, 'Platypnea is reported');
  return sec;
}

/* --------------------------------------------------------------------- FeNO */
function secFeno(f) {
  const sec = newSec('feno', 'FeNO'), n = f.feno, V = f.vals;
  if (!n.any) { sec.empty = true; sec.lines.push('No FeNO value entered.'); return sec; }
  const b = fenoBand(f);
  put(sec, 'FeNO is ' + (has(n.v) ? fmt(n.v, 0) + ' ppb, which is ' : '') + b.cat + ' by the ' + (n.child ? 'ATS 2011 pediatric (under 12 years)' : 'ATS 2011 adult') + ' cut-points (low below ' + b.lo + ', high above ' + b.hi + ' ppb)');
  if (n.ics === 'y') put(sec, 'The patient is taking inhaled corticosteroids');
  if (f.ctx.smoke === 'current') put(sec, 'The patient is a current smoker');
  if (n.confound) put(sec, ptext('feno.uninterpretable', 'standard') + ' (recent exercise, spirometry, nitrate-rich food or viral infection recorded)');
  if (!has(f.ctx.age)) put(sec, 'Age was not entered; adult cut-points were used');
  const id = n.child ? null : ('feno.' + b.cat);
  if (id && !n.confound) sec.impr.push(ptext(id, 'expanded'));
  else if (!n.confound) sec.impr.push('FeNO is ' + b.cat + ' by the pediatric cut-points; ' + (b.cat === 'high' ? 'this supports eosinophilic airway inflammation in the appropriate setting but does not independently diagnose asthma.' : (b.cat === 'low' ? 'substantial eosinophilic airway inflammation is less likely, although treatment and smoking affect the value.' : 'interpret with symptoms, atopy and treatment.')));
  else sec.impr.push('FeNO requires caution because a confounder was recorded; no category-based implication is drawn.');
  if (n.ics === 'y' && b.cat === 'low') sec.impr.push(ptext('feno.on_ics', 'expanded'));
  if (n.ics === 'y' && b.cat === 'high') sec.impr.push(ptext('feno.high_on_ics', 'expanded'));
  return sec;
}

/* ----------------------------------------------------------- bronchoprovocation */
function mchCategory(q) { const mc = q.mch || methacholineFacts(q); return mc.cat ? { cat: mc.cat === 'normal' ? 'negative' : mc.cat } : (mc.state === 'negative' ? { cat: 'negative' } : null); }
function secBronch(f) {
  const sec = newSec('bronch', 'BRONCHOPROVOCATION'), q = f.br, V = f.vals, F = f.F;
  if (!q.any) { sec.empty = true; sec.lines.push('No challenge data entered.'); return sec; }
  if (has(q.basePct) || has(q.baseL)) put(sec, 'Baseline FEV1 was ' + [has(q.baseL) ? fmt(q.baseL, 2) + ' L' : '', has(q.basePct) ? Math.round(q.basePct) + '% predicted' : ''].filter(Boolean).join(', '));
  if (q.type === 'mch') {
    const mc = q.mch;
    if (q.held === 'n') put(sec, ptext('methacholine.medications', 'standard'));
    if (F['challenge.pd20_reportable']) put(sec, ptext('methacholine.pd20', 'standard', V));
    if (F['challenge.pc20_reportable']) put(sec, ptext('methacholine.pc20', 'standard', V) || ptext('methacholine.pc20', 'concise', V));
    if (F['challenge.pd20_exceeds_max']) put(sec, ptext('methacholine.pd20_not_reached', 'standard', V));
    else if (F['challenge.pc20_exceeds_max']) put(sec, ptext('methacholine.pc20_not_reached', 'standard', V));
    else if (q.mchNeg) put(sec, 'No 20% fall in FEV1 occurred at the highest dose or concentration delivered' + (q.complete === 'y' ? ' (protocol completed)' : ''));
    if (has(q.mchFall)) put(sec, 'The largest fall in FEV1 was ' + fmt(q.mchFall, 1) + '%');
    if (q.complete === 'n') put(sec, 'The protocol was stopped before the planned maximum');
    const st_ = mc.state;
    if (st_ === 'positive') put(sec, ptext('methacholine.positive', 'standard'));
    else if (st_ === 'negative') put(sec, ptext('methacholine.negative', 'standard'));
    else if (st_ === 'incomplete') put(sec, ptext('methacholine.incomplete', 'standard'));
    else if (st_ === 'indeterminate') put(sec, ptext('methacholine.indeterminate', 'standard'));
    else if (st_ === 'diluent_response') put(sec, ptext('methacholine.diluent_response', 'standard'));
    if (mc.cat && mc.cat !== 'normal') put(sec, ptext('methacholine.ahr.' + mc.cat, 'standard') + (mc.catSrc === 'lab' ? ' (laboratory category)' : ' (ERS 2017 ranges)'));
    else if (mc.boundary) put(sec, 'The value sits exactly on the printed boundary between the ' + mc.boundary.between[0] + ' and ' + mc.boundary.between[1] + ' ranges; the laboratory category policy decides');
    if (has(q.recPct)) put(sec, ptext('methacholine.recovery', 'standard', V));
    // interpretation
    if (st_ === 'positive') sec.impr.push(ptext('methacholine.positive', 'expanded') + (mc.cat && mc.cat !== 'normal' ? ' The response is in the ' + mc.cat + ' range, which describes airway responsiveness, not asthma severity.' : ''));
    else if (st_ === 'negative') sec.impr.push(ptext('methacholine.negative', 'expanded'));
    else if (st_ === 'incomplete') sec.impr.push(ptext('methacholine.incomplete', 'expanded'));
    else if (st_ === 'indeterminate') sec.impr.push(ptext('methacholine.indeterminate', 'expanded'));
    else if (st_ === 'diluent_response') sec.impr.push(ptext('methacholine.diluent_response', 'expanded'));
    if (q.ics === 'y') { put(sec, 'The patient is taking inhaled corticosteroids'); sec.impr.push('Inhaled corticosteroids can lower the sensitivity of a direct challenge (by about 1.2 doubling doses).'); }
  } else if (q.type === 'man') {
    const st_ = exerciseState(q).state;
    let txt;
    if (has(q.manFall) && q.manFall >= 15 && has(q.manDose) && q.manDose > 635) txt = 'The 15% fall is recorded above the 635 mg cumulative dose; check the entries';
    else if (has(q.manFall) && q.manFall >= 15) txt = 'Mannitol challenge: FEV1 fell by ' + fmt(q.manFall, 1) + '%' + (has(q.manDose) ? ' at a cumulative dose of ' + fmt(q.manDose, 0) + ' mg (PD15)' : '') + ', meeting the 15% criterion';
    else if (q.manIncr) txt = 'Mannitol challenge: an incremental fall of at least 10% between consecutive doses meets the positive criterion';
    else if (q.manRes === 'pos') txt = 'Mannitol challenge: reported positive (15% fall from baseline by a cumulative 635 mg, or a 10% fall between consecutive doses)';
    else if (q.manRes === 'neg') txt = 'Mannitol challenge: reported negative at the completed protocol';
    else txt = 'Mannitol challenge: the largest fall in FEV1 was ' + (has(q.manFall) ? fmt(q.manFall, 1) + '%' : 'not entered') + (st_ === 'negative' ? ', below the 15% criterion at the full 635 mg' : '; whether the full 635 mg was delivered is not recorded, so a negative result is not established');
    put(sec, txt);
    if (st_ === 'positive') sec.impr.push('Mannitol challenge positive (indirect airway hyperresponsiveness); this supports but does not independently establish asthma.');
    else if (st_ === 'negative') sec.impr.push('Mannitol challenge negative at the completed protocol; mannitol is less sensitive than methacholine, so a negative result does not exclude asthma.');
    else sec.impr.push('Mannitol challenge result is not established (protocol completion not recorded).');
  } else {
    const nm = q.type === 'evh' ? 'Eucapnic voluntary hyperpnea' : 'Exercise challenge';
    const st_ = exerciseState(q).state;
    if (has(q.exFall)) {
      let sevt = '';
      if (q.exFall >= 10) sevt = q.exFall >= 50 ? 'severe' : (q.exFall >= 25 ? 'moderate' : 'mild');
      put(sec, nm + ': the largest fall in FEV1 was ' + fmt(q.exFall, 1) + '%' + (q.exFall >= 10 && !q.exConsec ? ' (not confirmed at two consecutive time points)' : ''));
      if (st_ === 'positive') sec.impr.push(nm + ' positive (fall of at least 10% at two consecutive time points): ' + sevt + ' bronchoconstriction by the ATS 2013 grades (mild 10–24%, moderate 25–49%, severe 50% or more); symptoms alone do not establish exercise-induced bronchoconstriction.');
      else if (st_ === 'incomplete') sec.impr.push(nm + ' incomplete: the criterion requires a fall of at least 10% at two consecutive time points, which was not confirmed.');
      else sec.impr.push(nm + ' negative (fall less than 10%) under the completed test conditions; an inadequate stimulus or medication effect must be considered when relevant.');
    } else if (q.exConsec) { put(sec, nm + ': fall of at least 10% at two consecutive time points'); sec.impr.push(nm + ' positive.'); }
    else if (q.exRes === 'neg') { put(sec, nm + ': reported negative (fall less than 10%)'); sec.impr.push(nm + ' negative under the completed test conditions.'); }
    else if (q.exRes === 'ind') { put(sec, nm + ': reported with a single time point only'); sec.impr.push(nm + ' incomplete: the criterion requires a fall of at least 10% at two consecutive time points.'); }
    else if (q.exRes === 'mild' || q.exRes === 'mod' || q.exRes === 'sev') {
      const w = ({ mild: 'mild (10–24%)', mod: 'moderate (25–49%)', sev: 'severe (50% or more)' })[q.exRes];
      put(sec, nm + ': reported positive with a ' + w + ' fall in FEV1');
      sec.impr.push(nm + ' positive: ' + w.replace(/ \(.*$/, '') + ' bronchoconstriction by the ATS 2013 grades.');
    }
  }
  if (q.rev === 'y') put(sec, 'FEV1 reversed with bronchodilator after the challenge'); else if (q.rev === 'n') put(sec, 'FEV1 did not reverse fully with bronchodilator after the challenge');
  return sec;
}

/* ------------------------------------------------------------------- 6MWT */
function secSix(f) {
  const sec = newSec('six', '6-MINUTE WALK TEST'), x = f.six, tr = f.trend6;
  if (!x.any && !tr.multi) { sec.empty = true; sec.lines.push('No 6-minute walk values entered.'); return sec; }
  const early = x.stop === 'early';
  if (has(x.dist)) {
    let t = (early ? 'Distance walked before stopping' : '6MWD') + ' was ' + fmt(x.dist, 0) + ' m' + (early && has(x.timeMin) ? ' in ' + fmt(x.timeMin, 1) + ' minutes' : '');
    if (!early && has(x.pctCalc)) t += ' (' + Math.round(x.pctCalc) + '% predicted' + (x.eq ? ', ' + x.eq : '') + ')';
    if (!early && has(x.lln)) t += '; the LLN is ' + fmt(x.lln, 0) + ' m, so the distance is ' + (x.dist < x.lln ? 'below' : 'at or above') + ' the LLN';
    put(sec, t);
    if (!x.eq && has(x.pctCalc)) put(sec, 'The reference equation is not named');
  }
  if (!has(x.dist) && x.distCat) put(sec, 'The walk distance is ' + (x.distCat === 'low' ? 'below the LLN' : 'within normal limits') + ' per the report');
  if (x.onO2) put(sec, 'The walk was performed on ' + x.o2text + '; saturations below are on oxygen');
  if (has(x.s0) || has(x.sn)) {
    let t = has(x.s0) ? 'SpO2 was ' + fmt(x.s0, 0) + '% at baseline' + (has(x.sn) ? ' with a nadir of ' + fmt(x.sn, 0) + '%' : '') + (has(x.se) ? ' and ' + fmt(x.se, 0) + '% at the end' : '')
      : 'The SpO2 nadir was ' + fmt(x.sn, 0) + '%' + (has(x.se) ? ' and ' + fmt(x.se, 0) + '% at the end' : '');
    put(sec, t);
    if (has(x.drop) && x.drop > 0) put(sec, 'SpO2 fell by ' + fmt(x.drop, 0) + ' points');

}

function spanTxt(days) {

}

  const c = tr.vsPrev;
  out.push('Latest versus previous walk: ' + fsign(c.dAbs, 0) + ' m (' + fsign(c.dPct, 1) + '%) over ' + spanTxt(c.days) + (has(c.perYear) ? '; annualised ' + fsign(c.perYear, 0) + ' m/yr' : ''));

  if (has(tr.slope)) out.push('Linear trend across all walks: ' + fsign(tr.slope, 0) + ' m/yr');
  if (tr.nadir && Math.abs(tr.nadir.d) >= 4) out.push('Nadir SpO2 changed from ' + fmt(tr.nadir.from.nadir, 0) + '% to ' + fmt(tr.nadir.to.nadir, 0) + '% between the last two walks');

}

const CPET_AGES = [20, 40, 60, 80];

}

  o2p:     { M: [12, 10, 9, 7],         F: [10, 8, 7, 6] },

  chk('VO2 at lactate threshold', k.lt, t(CPET.lt), '>', 0, '% of predicted peak');

  chk('Peak O2 pulse', k.o2p, t(CPET.o2p), '>', 1, ' mL/beat');

  chk('VE/VCO2 slope', k.slope, t(CPET.slope), '<', 1, '');
  chk('VE/VCO2 nadir', k.nadir, t(CPET.nadir), '<', 1, '');

  catChk('PETCO2 at LT', k.petco2c, 'low', 'PETCO2 at the lactate threshold is normal', 'PETCO2 at the lactate threshold is low');
  catChk('Peak SpO2', k.desatc, 'abn', 'There is no significant desaturation', 'There is desaturation (fall of 5 points or more, or below 93%)');

  if (has(k.rer) && k.rer < 1) o.eff.push('peak RER ' + fmt(k.rer, 2));

  if (has(k.bd) && has(k.bl) && k.bd <= 3 && k.bl <= 3) o.eff.push('peak Borg ratings ≤ 3');

  if (!has(k.rer) && k.rerc === 'lo') o.eff.push('peak RER below 1.0');

  o.gx = bad('VE/VCO2 slope') || bad('VE/VCO2 nadir') || bad('Peak SpO2') || bad('SpO2 fall');

    if (o.circ) o.pattern.push('impaired O2 delivery or utilisation (cardiocirculatory or peripheral muscle)');

function abgEval(f) {

      }

        if (hco3 >= acute - 2) t += ' (HCO3 fits an acute process)'; else if (hco3 <= chronic + 2) t += ' (HCO3 fits chronic compensation)'; else t += ' (partially compensated)';
      }

      if (g.pco2 > exp + 2) t += ' with an additional respiratory acidosis'; else if (g.pco2 < exp - 2) t += ' with an additional respiratory alkalosis';

    o.lines.push(t);

  } else if (g.aaC) {
    o.aaHigh = g.aaC === 'wide';
    o.lines.push('A–a gradient is ' + (o.aaHigh ? 'widened' : 'normal for age') + ' per the report');
    if (o.aaHigh) o.impr.push('Widened A–a gradient, indicating a gas-exchange abnormality (V/Q mismatch, shunt or diffusion limitation).');

  }
  if (f.on.mip && f.mp.any) {
    H('TQ15', 'note', 'Technique', 'MIP and MEP are effort-dependent', 'Low values can come from submaximal effort, hyperinflation or neuromuscular disease; three maneuvers are usually needed to show a maximal effort, and SNIP adds information for inspiratory strength. MIP is not an anatomic diaphragm test and MEP is not a complete cough assessment.');

      H('TQ26', 'note', 'Technique', 'Pressure compared with a screening threshold', 'No laboratory lower limit was entered, so the commonly cited screening values were used and are named in the report. Enter the lab LLN (magnitude) for a reference-based statement.');

  if (has(ctx.age)) {

  }

  /* ---------- physiologic discordance ---------- */
  if (spOn && volOn) {
    if (!R.low && B.low && T.measured && T.wnl)
      H('PH1', 'caution', 'Physiology', 'Low FVC with a normal TLC', 'Restriction is not confirmed (nonspecific pattern). Consider submaximal effort or weakness, obesity, air trapping (check RV/TLC), FVC-versus-SVC differences, or a gas-dilution TLC that underestimates. Such discordance is usually seen when values are only mildly reduced.');

      H('PH2', 'caution', 'Physiology', 'Normal FVC with a low TLC', 'Spirometry and volumes disagree; a normal FVC and FEV1/FVC are usually reliable at ruling out restriction (ERS/ATS 2022). Check the TLC method and quality before accepting restriction.');

      H('PH5', 'note', 'Physiology', 'SVC exceeds FVC by more than 100 mL', 'May reflect dynamic airway closure during the forced maneuver after quality and consistency review; no disease-defining difference exists. Volumes are referenced to the SVC.');
    if (spp.highTlcReview) H('PH47', 'caution', 'Physiology', 'Reduced spirometric volumes with a TLC above the ULN', 'This does not fit the nonspecific pattern (normal TLC required) or restriction; review effort, the vital-capacity maneuvers and the lung-volume method.');
    if (T.low && v.rvtlc.high && !R.low) H('PH48', 'note', 'Physiology', 'Elevated RV/TLC with a low TLC', 'In restriction the elevated RV/TLC can partly reflect the lower TLC (complex restriction); it is not automatically air trapping. Neuromuscular weakness, chest-wall restriction and occult small-airway disease are the usual contributors.');
  }
  if (spOn && R.low && A.wnl && B.wnl) H('PH6', 'note', 'Physiology', 'Low ratio with preserved FEV1 and FVC', 'Reported as obstruction with a preserved FEV1 (Annals ATS 2025 labels it mild obstruction, S21). ERS/ATS 2022 notes that dysanapsis can produce the pattern, especially in tall young adults with a high FVC; it is not dismissed as a normal variant automatically. If you judge it so, add the dysanapsis wording on the Report step.');
  if (spOn && R.low && B.high) H('PH7', 'note', 'Physiology', 'Low ratio with a high FVC', 'A high FVC with a preserved FEV1 and low ratio can reflect dysanapsis. Whether this is obstruction depends on pretest probability and additional tests (BDR, DLCO, exercise testing).');
  if (spOn && spp.kind === 'concave') H('PH8', 'note', 'Physiology', 'Concave flow-volume loop with normal indices', 'FEF25–75% is not specific for small-airway disease; oscillometry, multiple-breath washout and imaging may add information (ERS/ATS 2022).');
  if (spOn && sp.fef.low && normalSpiro) H('PH9', 'note', 'Physiology', 'Isolated low FEF25–75%', 'ERS/ATS 2022 does not recommend using mid-flows to define small-airway dysfunction or obstruction when the other indices are normal.');
  if (spOn && R.measured && !R.low && A.low && B.low && !f.hasTLC)
    H('PH10', 'caution', 'Missing data', 'Reduced FEV1 and FVC with a preserved ratio, no lung volumes', 'The nonspecific pattern can only be named once TLC is known to be normal; without TLC this is a low FVC with restriction unconfirmed. In smokers the fixed-ratio/80% version of this pattern is called PRISm (a named phenotype with its own definition).');

  if (dlOn) {
    if (F['patterns.isolated_low_dlco'])
      H('PH11', 'caution', 'Physiology', 'Low DLCO with normal spirometry and lung volumes', 'Isolated gas-transfer reduction. Check hemoglobin and COHb; the differential (pulmonary vascular disease, emphysema with preserved volumes, early parenchymal disease, anemia) is available as a reviewed addition on the Report step. Exertional oximetry/6MWT, CPET and imaging or echocardiography can follow, as clinically appropriate.');

      H('PH12', 'note', 'Physiology', 'Obstruction with hyperinflation or trapping and reduced gas transfer', 'Loss of gas transfer on top of obstruction and hyperinflation is the physiology seen with emphysema; the wording "compatible with emphysema in the appropriate setting" is available as a reviewed addition once imaging and history support it.');

      H('PH14', 'caution', 'Physiology', 'Low DLCO with high KCO and normal VA', 'This combination is unusual; KCO limits are derived from subjects with normal VA. Check the VA, the DLCO and the breath-hold quality.');
    if (Dm.low && d.anemic === true && d.pat.hb !== 'full' && !d.reportedAdjusted)
      H('PH15', 'note', 'Physiology', 'Low hemoglobin contributes to a low DLCO', (has(d.hb) ? 'Hb ' + fmt(d.hb, 1) + ' g/dL' : 'A low hemoglobin') + ' lowers the unadjusted DLCO; interpret the adjusted value (' + (d.adj.measured ? 'entered' : 'not entered') + ').');
    if (Dm.low && !volOn && !has(d.vatlc))
      H('PH16', 'note', 'Missing data', 'DLCO without lung volumes', 'VA/TLC cannot be calculated; lung volumes help separate loss of expansion from loss of gas-transfer surface, and an "isolated" DLCO reduction cannot be claimed without them.');

    if (d.pat.mech === 'lowVA_normalKCO') H('PH18', 'note', 'Physiology', 'Normal KCO with low VA', 'Normal limits for KCO come from subjects with normal alveolar volumes; a normal KCO in the setting of a low VA should not be taken as normal gas transfer, and a normal KCO does not rule out interstitial lung disease.');
  }

  if (f.on.mip && f.mp.any) {
    const lowIE = f.mp.mip === 'low' || f.mp.mep === 'low' || f.mp.snip === 'low';
    if (lowIE && (B.low || T.low)) H('PH19', 'note', 'Physiology', 'Weak respiratory muscles with a restrictive-type pattern', 'Reduced strength with a low FVC/TLC fits a neuromuscular or chest-wall restrictive pattern (complex restriction with raised RV/TLC supports this). The "muscle contribution to restriction" wording is a reviewed addition on the Report step. Check the upright-to-supine fall, an ABG for hypoventilation, and a DLCO with VA/KCO.');
    if (lowIE && normalSpiro && (!volOn || T.wnl)) H('PH20', 'caution', 'Physiology', 'Low respiratory-muscle pressures with normal spirometry and volumes', 'MIP/MEP depend on effort and technique. Confirm with repeat maneuvers or SNIP; if symptoms suggest weakness, consider supine VC and neurophysiology.');
    if (lowIE && (vp.hyperinflation || (R.low && vp.airTrapping))) H('PH21', 'note', 'Physiology', 'Hyperinflation can lower MIP and MEP', 'Reduced pressures in the presence of hyperinflation do not by themselves establish muscle weakness.');
    if (!lowIE && (f.mp.mip === 'normal' || f.mp.snip === 'normal') && f.on.post && f.post.ge20)
      H('PH22', 'caution', 'Physiology', 'Marked supine fall with normal inspiratory strength', 'A supine VC fall of 20% or more with normal MIP/SNIP is discordant; recheck the maneuvers and consider diaphragm imaging if symptoms persist.');
  }
  if (f.on.post && f.post.ge20 && !f.on.mip) H('PH23', 'note', 'Missing data', 'Postural fall without MIP/MEP', 'A supine fall of 20% or more raises concern for diaphragm weakness; MIP/SNIP would add information.');
  if (f.on.gas && f.gas.any) {
    if (f.gas.hyperC && normalSpiro && volNormal && (!f.on.mip || f.mp.mip !== 'low'))
      H('PH24', 'caution', 'Physiology', 'Hypercapnia with normal spirometry and volumes', 'Unexplained by the ventilatory pump tests entered; consider central hypoventilation, obesity hypoventilation, early neuromuscular disease or sleep-disordered breathing, and check respiratory-muscle strength.');
    const g = abgEval(f);
    if (g.aaHigh && normalSpiro && volNormal && (!dlOn || Dm.wnl))
      H('PH25', 'caution', 'Physiology', 'Widened A–a gradient with normal spirometry, volumes and DLCO', 'Consider shunt (DLCO is often normal), V/Q mismatch or pulmonary vascular disease; correlate with echocardiography, imaging and exertional testing.');
    if (f.gas.hypoxC && f.gas.hyperC) H('PH26', 'note', 'Physiology', 'Hypoxemia with hypercapnia', 'Hypoventilation explains part of the hypoxemia when the A–a gradient is normal; supplemental oxygen can worsen hypercapnia in chronic ventilatory failure.');
    if (has(f.gas.cohb) && f.gas.cohb >= 3) H('PH27', 'note', 'Technique', 'Elevated COHb on the blood gas', 'SpO2 overestimates saturation when COHb is raised; also lowers DLCO.');
  }
  if (f.on.sixmw && f.six.any) {
    if (f.six.desat && normalSpiro && volNormal && (!dlOn || Dm.wnl))
      H('PH28', 'caution', 'Physiology', 'Exertional desaturation with normal resting tests', 'Consider pulmonary vascular disease, a right-to-left shunt (for example PFO), early interstitial disease, or an oximetry/probe artifact; CPET and further cardiac assessment can clarify.');
    if (f.six.lowDist && normalSpiro && volNormal && (!dlOn || Dm.wnl))

    if (f.six.onO2) H('PH30', 'note', 'Technique', '6MWT performed on oxygen', 'Saturations reflect ' + f.six.o2text + '; "no desaturation" on oxygen does not demonstrate normal room-air oxygenation. Repeat on room air to assess the oxygen requirement.');

    if (f.six.stop === 'early') H('PH49', 'note', 'Technique', 'Walk stopped before six minutes', 'The achieved time and distance are reported; they are not a completed six-minute result and are not compared with the predicted 6MWD.');
  }
  if (f.on.cpet && f.cp.any) {
    const e = cpetEval(f);

    if (b.cat === 'high' && f.on.bronch && f.br.any && f.br.type === 'mch' && f.br.mch.state === 'negative') H('PH38', 'caution', 'Physiology', 'High FeNO with a negative methacholine challenge', 'Discordant; consider eosinophilic bronchitis, steroid effect on challenge, or a technical issue.');
  }
  if (f.on.bronch && f.br.any) {
    let basePct = f.br.basePct, baseL = f.br.baseL;

    if (!has(baseL) && spOn) baseL = sp.fev1L;
    if (f.br.type === 'mch' && (f.br.baseOk === 'low' || (has(basePct) && basePct < 60) || (has(baseL) && baseL < 1.5) || (spOn && A.grade >= 2 && !has(basePct) && !has(baseL) && f.br.baseOk !== 'ok')))

    if (f.br.type === 'mch' && f.br.mch.boundary) H('PH50', 'caution', 'Technique', 'PD20/PC20 sits exactly on a category boundary', 'ERS 2017 ranges share printed endpoints (' + f.br.mch.boundary.between.join(' / ') + '). No category is auto-assigned; use the laboratory category policy and tap the lab result above.');
    if (f.br.type === 'mch' && (f.br.mchNeg || f.br.mchCat === 'neg') && f.br.complete === '') H('PH51', 'note', 'Missing data', 'Challenge completion not recorded', 'A negative result assumes the planned maximum dose or concentration was delivered; if the study was stopped early it is incomplete, not negative. Record the completion status.');
    if (f.br.type === 'mch' && f.br.mchNeg && !has(f.br.mchMax)) H('PH52', 'note', 'Missing data', 'Maximum dose or concentration not entered', 'A censored result is reported as PD20/PC20 greater than the maximum delivered; enter that maximum so the report can state it.');

  }

    H('PH54', 'caution', 'Missing data', 'Bronchodilator response: one metric missing', 'A negative response needs both FEV1 and FVC assessed; with one missing the result is indeterminate (a positive response in the available metric would still count). Enter the other metric or tap the lab\'s verdict.');
  if (f.on.bd && f.bd.any && f.bd.discordant) H('PH55', 'note', 'Physiology', 'Current and legacy response criteria disagree', 'The ERS/ATS 2022 criterion (> 10% of predicted) is the default; the 2005 profile (≥ 12% and ≥ 200 mL from baseline) is shown for reference only and the two are never merged.');
  if (f.on.raw && f.raw.any && spOn) {
    if ((f.raw.raw.high || f.raw.sraw.high || f.raw.sgaw.low) && !R.low) H('PH42', 'note', 'Physiology', 'Raised airway resistance without spirometric obstruction', 'Raw can detect airway narrowing when spirometry is non-specific or normal (ERS/ATS 2022 Table 5), but is not an independent diagnostic criterion.');
    if (R.low && A.grade >= 2 && f.raw.raw.wnl && f.raw.sraw.wnl) H('PH43', 'caution', 'Physiology', 'Normal airway resistance with moderate-to-severe obstruction', 'Resistance can be normal in emphysema or when obstruction is peripheral, but verify the panting technique.');
  }
  if (f.on.osc && f.osc.any && normalSpiro) {
    if (f.osc.r5.high || f.osc.x5.low || f.osc.ax.high || f.osc.r520.high) H('PH44', 'note', 'Physiology', 'Abnormal oscillometry with normal spirometry', 'Oscillometry can show altered mechanics when FEV1/FVC is normal (ERS/ATS 2022); correlate with symptoms and BDR. No universal device-independent cut-offs exist.');
  }
  if (f.on.fvl && f.fvl.any && f.fvl.pef.low && !(R.low || A.low) && B.wnl) H('PH45', 'caution', 'Physiology', 'Reduced PEF with preserved FEV1 and FVC', 'PEF can fall before FEV1 and FVC in central or upper-airway obstruction (ERS/ATS 2022), but is also reduced by poor initial effort. Review inspiratory and expiratory loops.');
  if (f.on.fvl && f.fvl.any && f.fvl.fevPefHi === true && sp.loop === 'normal') H('PH46', 'caution', 'Physiology', 'FEV1/PEF above 8 with a normal-looking loop', 'The loop description and the index disagree; recheck the loop or the numeric entries.');

  /* ---------- 6MWD trend ---------- */
  if (f.on.sixmw) {
    const tr = f.trend6;
    if (tr.skipped) H('TR1', 'note', 'Missing data', tr.skipped + (tr.skipped === 1 ? ' trend entry was' : ' trend entries were') + ' not used', 'A walk needs both a valid date and a distance to be plotted.');
    if (tr.curMissingDate && tr.any) H('TR2', 'note', 'Missing data', 'Today’s walk is not in the trend', 'Enter the study date on the Details step so the current 6MWD can join the saved walks.');
    if (tr.futureDate) H('TR3', 'caution', 'Data entry', 'A saved walk is dated after the study date', 'Check the dates of the saved walks and of this study.');
    if (tr.dupDates) H('TR4', 'note', 'Data entry', 'Two walks share the same date', 'Two entries with the same date but different distances; the best of two walks done on one day is the usual reported value.');
    if (tr.multi) {
      const c = tr.vsPrev;
      if (c.cls === 'down') H('TR5', 'caution', 'Trend', '6MWD fell by ' + fmt(Math.abs(c.dAbs), 0) + ' m since the previous walk', 'This exceeds the 30 m minimal important difference (ERS/ATS 2014). Before ascribing it to disease progression, check that the protocol matched the earlier walk and look for intercurrent illness, pain, deconditioning or a change in oxygen use; a repeat walk helps confirm it.');
      if (c.cls === 'up') H('TR6', 'note', 'Trend', '6MWD rose by ' + fmt(c.dAbs, 0) + ' m since the previous walk', 'This exceeds the 30 m minimal important difference. A rise can reflect treatment effect or recovery, but also a learning effect (the second walk averages about 26 m longer), more encouragement, a shorter-track difference or supplemental oxygen.');
      if (tr.ipf && f.ctx.hasInd('ild')) H('TR7', 'caution', 'Trend', 'Fall of more than 50 m over about 6 months', 'In the IPF cohort of du Bois et al. (2011, n = 822) a fall of more than 50 m over 24 weeks was associated with a several-fold higher risk of death within the next year (hazard ratio 4.27). Read it with the FVC and DLCO trends and the physiologic progression criteria.');
      if (tr.nadir && tr.nadir.d <= -4) H('TR8', 'caution', 'Trend', 'Nadir SpO2 fell by ' + fmt(Math.abs(tr.nadir.d), 0) + ' points since the previous walk', 'Exertional desaturation can worsen while the distance is preserved; the distance–saturation product (distance × nadir SpO2) combines both. Confirm a good pulse-oximetry signal and the same oxygen use.');

      H('TR10', 'note', 'Technique', 'Trend compares absolute distances from possibly different protocols', 'Walks are comparable only if done the same way (ERS/ATS 2014): the second of two tests averages about 26 m longer, a 10 m rather than a 30 m track shortens the distance by roughly 50 m, standard encouragement adds about 30 m, and a wheeled walker adds about 6%. The utility of % predicted for tracking change has not been established, so distances in metres are compared.');
    }
  }

  /* ---------- comparison ---------- */
  if (f.on.prior && f.prior.any) {
    const usesPct = f.priors.some(p => p.metrics.some(m => m.pp));
    if (usesPct && !f.priors.some(p => p.cmp.ref)) H('PR1', 'note', 'Comparison', 'Compare like with like', '% predicted values from different reference equations (for example a GLI update or race-specific equations) are not interchangeable; if the prior used another set, tick "different reference equations" on the prior and compare measured values.');
    f.priors.forEach(p => {
      if (p.cmp.ref) H('PR0-' + p.idx, 'caution', 'Comparison', 'Reference equations differ (prior #' + p.idx + ')', 'Part of any percent-predicted change may reflect the equation change; measured values are compared and the percent-predicted change is reported with that caveat. Recomputation on a common reference is the clean solution.');
      p.metrics.forEach(m => {
        if (!m.comparable) return;
        if (m.k === 'fev1' || m.k === 'fvc') {
          if (m.dPct <= -15) H('PR2-' + p.idx + m.k, 'caution', 'Comparison', m.name + ' fell by ' + fmt(Math.abs(m.dPct), 1) + '% since prior study #' + p.idx, 'This is at or beyond the 15% change that ERS/ATS 2022 describes as exceeding expected variability; it is not a universal progression criterion. Review technique, acute illness and adherence.');
          else if (has(m.pctPerYear) && m.pctPerYear <= -8) H('PR3-' + p.idx + m.k, 'caution', 'Comparison', m.name + ' decline of ' + fmt(Math.abs(m.pctPerYear), 1) + '%/yr', 'Meets the 8%/yr rapid-decline marker.');
          if (m.k === 'fev1' && m.dPct <= -10 && m.dPct > -15) H('PR4-' + p.idx, 'note', 'Comparison', 'FEV1 fell by about ' + fmt(Math.abs(m.dPct), 0) + '% from the prior value', 'A fall of 10% or more from the previous value is commonly used to flag a possible pulmonary exacerbation in cystic fibrosis.');
          if (m.dPct >= 15) H('PR5-' + p.idx + m.k, 'note', 'Comparison', m.name + ' rose by ' + fmt(m.dPct, 1) + '%', 'An improvement beyond 15% exceeds expected variability; consider treatment effect, recovery from an acute process, or technique differences.');
        }
        if (m.k === 'dlco_pct' && m.dAbs <= -10) H('PR6-' + p.idx, 'caution', 'Comparison', 'DLCO fell by ' + fmt(Math.abs(m.dAbs), 0) + ' points of predicted', 'In a non-IPF fibrotic ILD an absolute fall of 10 points within a year is the DLCO component of the physiologic progression criterion (ATS/ERS/JRS/ALAT 2022); FVC and DLCO form one domain, and PPF needs a second domain.');

}

/* ------------------------------------------------------------ report text */
function studyHeader(f) {
  const bits = [];
  const c = f.ctx;
  if (has(c.age)) bits.push(fmt(c.age, 0) + '-year-old');
  if (c.sex) bits.push(c.sex === 'M' ? 'male' : 'female');
  if (has(c.ht)) bits.push('height ' + fmt(c.ht, 0) + ' cm');
  if (has(c.bmi)) bits.push('BMI ' + fmt(c.bmi, 1));
  if (c.smoke) bits.push(c.smoke + ' smoker');
  return bits.join(', ');
}
function testsPerformed(f) {
  const names = [];
  TESTS.forEach(t => {
    if (!f.on[t.key]) return;
    let n = t.name;
    if (t.key === 'vol') { const m = { pleth: 'body plethysmography', n2: 'nitrogen washout', he: 'helium dilution', sb: 'single-breath' }[f.vol.method]; if (m) n += ' (' + m + ')'; }
    names.push(n);
  });
  return names;
}
function referenceLine(f) {
  const e = f.ctx.eq, on = f.on, parts = [];
  if (on.spiro || on.bd || on.fvl) parts.push('spirometry ' + ({ global: 'GLI Global (race-neutral)', gli2012: 'GLI-2012', other: 'per laboratory' })[e.spiro]);
  if (on.vol) parts.push('lung volumes ' + ({ gli2021: 'GLI-2021', other: 'per laboratory' })[e.vol]);
  if (on.dlco) parts.push('DLCO ' + ({ gli2017: 'GLI-2017', other: 'per laboratory' })[e.dlco]);
  return parts.length ? parts.join('; ') : 'not applicable';
}
const GRADING_LINE = 'Impairment is graded by z-score (ERS/ATS 2022): LLN at z = −1.645; mild from −1.645 down to −2.5; moderate below −2.5 down to −4.0; severe below −4.0. The grade describes the measurement, not disease severity.';
function buildText(f, secs, impression, headsup, withHeadsup) {
  const L = [];
  L.push('PULMONARY FUNCTION TEST REPORT');
  const hdr = [];
  if (f.st.ctx.date) hdr.push('Date: ' + f.st.ctx.date);
  const sh = studyHeader(f); if (sh) hdr.push(sh);
  if (hdr.length) L.push(hdr.join(' | '));
  const ind = f.ctx.indicLabels.slice(); if (f.ctx.indication) ind.push(f.ctx.indication);
  if (ind.length) L.push('Indication: ' + ind.map((x, i) => i === 0 ? cap(x) : x).join('; '));
  L.push('Tests performed: ' + (testsPerformed(f).join('; ') || 'none selected'));
  L.push('Reference: ' + referenceLine(f) + '. ' + GRADING_LINE + (f.on.vol && f.vol.pat.restriction && f.vol.pat.sev ? ' Restriction severity is graded by the TLC z-score (Annals ATS 2025 convention).' : ''));
  L.push('');
  secs.forEach(s => { L.push(s.title + ': ' + s.lines.join(' ')); L.push(''); });
  L.push('INTERPRETATION:');
  if (impression.length) impression.forEach((s, i) => L.push((i + 1) + '. ' + s));
  else L.push('No interpretable data entered.');
  if (withHeadsup && headsup.length) {
    L.push('');
    L.push('HEADS-UP FOR THE INTERPRETER (not part of the final report):');
    headsup.forEach(h => L.push('- [' + h.lvl.toUpperCase() + '] ' + h.title + ': ' + h.text));
  }
  return L.join('\n');
}

/* ------------------------------------------------------------- public API */
function interpret(raw) {
  const st = normalizeState(raw);
  const f = buildFacts(st);
  f.vals = placeholderValues(f);
  const secs = [];
  const add = (key, fn) => {
    if (!f.on[key]) return;
    const sec = fn(f);
    if (!sec.lines.length) sec.lines.push('The values entered are incomplete, so no statement can be made.');
    secs.push(sec);
  };
  add('spiro', secSpiro); add('fvl', secFvl); add('bd', secBD); add('vol', secVol); add('dlco', secDlco);
  add('raw', secRaw); add('osc', secOsc); add('mip', secMip); add('post', secPost); add('feno', secFeno);
  add('bronch', secBronch); add('sixmw', secSix); add('cpet', secCpet); add('gas', secGas); add('prior', secPrior);

  const headsup = buildHeadsUp(f, secs);

<script>

(function (root) {

const G = {
  /* ------------------------------------------------------------- reading the numbers */
  z:        { n: 'z-score', f: 'Standard deviation score', w: 'How many standard deviations a measurement lies from the average for a healthy person of the same age, sex and height (and ancestry, if the equation set uses it).',
              r: 'A z-score of 0 is average. The lower limit of normal (LLN) is −1.645 (5th percentile); the upper limit (ULN) is +1.645. Severity of an impairment is graded by how far below the LLN the value lies.',
              l: 'A z-score is only as valid as the reference equation behind it. It does not tell you the cause, and values just beyond the LLN are common in healthy people (5% by definition).', t: 'basics' },
  lln:      { n: 'LLN / ULN', f: 'Lower / upper limit of normal', w: 'The 5th and 95th percentiles of the reference population: z = −1.645 and +1.645.',

              r: 'Familiar, but a fixed cut-off (such as 80%) misclassifies tall, short, young and old people because the spread around the mean changes with age and height.',

  quality:  { n: 'Quality grade', f: 'ATS/ERS 2019 spirometry grade (A–F, U), separately for FEV1 and FVC', w: 'A grade for each of FEV1 and FVC based on how many acceptable maneuvers there were and how closely the two best repeat (within 150 mL). The two can differ: a cough in the first second spoils FEV1 but not FVC; early termination spoils FVC but not FEV1.',
              r: 'A and B: good, interpret with confidence. C to E: usable, but technical factors reduce confidence. U: usable only. F: not usable; that component is reported as not interpretable and drives no pattern or severity statement.',
              l: 'Quality grades describe the maneuvers, not the patient. A poor grade can hide or mimic disease. Documented limitations (early termination, cough, leak, variable effort) are entered as what the lab or tracing shows, never inferred from the numbers.', t: 'spiro' },

  /* ---------------------------------------------------------------------- spirometry */
  fev1:     { n: 'FEV1', f: 'Forced expiratory volume in 1 second', w: 'The volume blown out in the first second of a maximal forced exhalation.',
              r: 'With a low FEV1/FVC, the FEV1 z-score sets the severity of the obstruction. A low FEV1 with a normal ratio goes with a low FVC (restriction or a technical cause).',

  fvc:      { n: 'FVC', f: 'Forced vital capacity', w: 'The total volume blown out in a maximal, complete forced exhalation.',
              r: 'Low FVC with a normal or high ratio suggests restriction (TLC confirms it). Low FVC with a low ratio means air trapping, coexisting restriction, or a short exhalation; TLC and RV separate them.',
              l: 'A low FVC alone is not proof of restriction: about half of such patients have a normal TLC. Submaximal effort and early termination lower it too.', t: 'spiro' },
  ratio:    { n: 'FEV1/FVC', f: 'Ratio of FEV1 to FVC', w: 'The fraction of the vital capacity blown out in the first second. It is the first number to check.',

  fef:      { n: 'FEF25–75%', f: 'Forced expiratory flow, middle half of the FVC', w: 'The average flow between 25% and 75% of the exhaled volume.',

  effort:   { n: 'Effort / cooperation', f: 'Effort and muscle strength during the maneuver', w: 'Whether the testing team judged the maneuvers to be maximal.',

              r: 'With reduced flows, FIF50/FEF50 below 1 fits a variable extrathoracic obstruction, about 1 a fixed obstruction, and above 1 a variable intrathoracic one (ERS/ATS 2022 Table 6).',

  bd:       { n: 'Bronchodilator response', f: 'Change after an inhaled bronchodilator', w: 'Repeat spirometry after a short-acting bronchodilator.',
              r: 'A significant response is an increase of more than 10% of the predicted value in FEV1 and/or FVC (ERS/ATS 2022). A low ratio that returns to normal after the drug is reversible obstruction.',

  loop:     { n: 'Flow–volume loop', f: 'Plot of flow against volume', w: 'Expiration plots above the line and inspiration below. The shape shows effort, technique and the site and type of airway narrowing.',
              r: 'Scooped (concave) = obstruction; small, steep, narrow = restriction; plateaus = upper-airway obstruction; saw-tooth = unstable airway or tremor.',
              l: 'The shape supports, but does not replace, the numbers. Many shapes are not specific, and poor effort can imitate several of them.', t: 'loops' },

  /* ------------------------------------------------------------------- lung volumes */
  tlc:      { n: 'TLC', f: 'Total lung capacity', w: 'The volume of air in the lungs after a maximal inhalation.',
              r: 'Below the LLN defines restriction. Above the ULN suggests hyperinflation (or large lungs). With a low FEV1/FVC, a low TLC means a mixed pattern.',

  rv:       { n: 'RV', f: 'Residual volume', w: 'The air left in the lungs after a maximal exhalation.',

  rvtlc:    { n: 'RV/TLC', f: 'Residual volume as a fraction of TLC', w: 'How much of the total capacity cannot be emptied.',
              r: 'Above the ULN = air trapping. Raised with a normal or low TLC also occurs with weakness or chest-wall restriction (complex restriction).',

  frc:      { n: 'FRC', f: 'Functional residual capacity', w: 'The volume in the lungs at the end of a normal quiet breath: where lung recoil and chest-wall recoil balance.',

  svc:      { n: 'SVC', f: 'Slow vital capacity', w: 'The volume from full inhalation to full exhalation without forcing.',

  ic:       { n: 'IC', f: 'Inspiratory capacity', w: 'The volume that can be inhaled from the resting end-expiratory level (TLC minus FRC).', r: 'Low with hyperinflation (the lung sits close to TLC at rest), which limits exercise.', l: 'Changes with the breathing pattern.', t: 'vol' },
  voltech:  { n: 'Volume technique', f: 'Plethysmography, gas dilution or single-breath', w: 'How the lung volumes were measured.',
              r: 'Plethysmography measures all gas in the chest, including trapped gas. Nitrogen washout and helium dilution measure only gas that mixes; single-breath dilution (VA) is the least accurate.',

  dlco:     { n: 'DLCO', f: 'Diffusing capacity of the lung for carbon monoxide (TLCO)', w: 'How well carbon monoxide crosses from the alveoli into the blood in a single breath.',

  vatlc:    { n: 'VA/TLC', f: 'Alveolar volume as a fraction of TLC', w: 'How much of the lung took part in the single breath.', r: 'Below about 0.85 reflects uneven ventilation, which lowers the measured DLCO.', l: 'Needs a reliable TLC.', t: 'dlco' },

  orthodeox:{ n: 'Orthodeoxia', f: 'Fall in oxygenation on standing', w: 'A fall in SpO2 of at least 5 points (or in PaO2 of more than 4 mmHg) from supine to upright.', r: 'Seen with intracardiac or intrapulmonary shunts (PFO, hepatopulmonary syndrome) and basal lung disease.', l: 'Needs a good oximetry signal in both positions.', t: 'post' },

  { p: 'A pulmonary function report is read in a fixed order, and each step narrows what the next one means. The order below is the one ERS/ATS 2022 recommends and the one this app follows.' },
  { h: 'The order of reasoning', ol: [
    'FEV1/FVC against the lower limit of normal (LLN). A ratio below the LLN is airflow obstruction, and nothing else defines it.',
    'If the ratio is low: the FEV1 z-score sets the severity. The FVC then points to other pathology (a low FVC with obstruction means air trapping, coexisting restriction, or a short exhalation).',
    'Total lung capacity (TLC): low = restriction, normal, or high = hyperinflation. Only the TLC can confirm restriction.',
    'RV and RV/TLC: high with obstruction = air trapping and hyperinflation. Low TLC with a high RV/TLC = complex restriction (think weakness or chest wall).',
    'DLCO, graded by its z-score and always read with VA and KCO, with the hemoglobin (and carboxyhemoglobin) in mind.',
    'Then the extras: bronchodilator response, loop shape, muscle strength, FeNO, challenge testing, exercise tests, blood gas.',
    'Compare with prior studies, then put pattern, severity, gas transfer and the clinical question together in the interpretation.'] },
  { h: 'z-scores and the lower limit of normal', p: 'A z-score says how many standard deviations a result sits from the average of healthy people of the same age, sex and height. Zero is average. The LLN is −1.645 (the 5th percentile) and the ULN is +1.645. Because the spread of healthy values changes with age and height, a z-score is fair across the whole age range, where a fixed percentage of predicted is not.', fig: 'zscale' },
  { h: 'Severity bands (ERS/ATS 2022)', table: { head: ['z-score', 'Label'], rows: [['−1.645 to −2.5', 'Mild'], ['−2.51 to −4.0', 'Moderate'], ['below −4.0', 'Severe'], ['above +1.645', 'Above the upper limit of normal']] },
